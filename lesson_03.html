<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membongkar "Surds" Secara Visual - Interactive Lesson</title>
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #58cc02; /* Duolingo green */
            --primary-dark: #46a302;
            --bg: #131f24;
            --bg-panel: #1b2b32;
            --bg-card: #243840;
            --text-main: #ffffff;
            --text-muted: #a0c4b8;
            --border: #3a5a60;
            --danger: #ff4b4b;
            --warning: #ffc800;
            --sidebar-width: 280px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: var(--sidebar-width); background: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; z-index: 10; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); text-align: center; }
        .sidebar-header h2 { color: var(--primary); font-size: 1.2rem; margin-bottom: 5px; }
        .sidebar-header p { font-size: 0.8rem; color: var(--text-muted); }
        .nav-list { list-style: none; padding: 10px 0; flex-grow: 1; }
        .nav-item { padding: 12px 20px; cursor: pointer; display: flex; align-items: center; transition: 0.2s; border-left: 4px solid transparent; font-size: 0.9rem; }
        .nav-item:hover { background: var(--bg-card); }
        .nav-item.active { background: var(--bg-card); border-left: 4px solid var(--primary); color: var(--primary); font-weight: bold; }
        .nav-item.completed { color: var(--text-muted); }
        .nav-item.completed::before { content: '\f00c'; font-family: 'Font Awesome 6 Free'; font-weight: 900; margin-right: 10px; color: var(--primary); }
        .nav-item i { margin-right: 10px; width: 20px; text-align: center; }
        .reset-btn { margin: 20px; padding: 10px; background: var(--danger); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .reset-btn:hover { background: #e03e3e; }

        /* Main Content */
        .main { flex-grow: 1; overflow-y: auto; padding: 40px; display: flex; justify-content: center; }
        .content-wrapper { max-width: 800px; width: 100%; }
        
        /* Cards & Theory */
        .card { background: var(--bg-card); border-radius: 16px; padding: 30px; margin-bottom: 30px; border: 1px solid var(--border); box-shadow: 0 4px 15px rgba(0,0,0,0.2); animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .card h2 { color: var(--primary); margin-bottom: 15px; display: flex; align-items: center; }
        .card h2 i { margin-right: 10px; }
        .id-lang { display: block; font-size: 0.85em; color: var(--text-muted); margin-top: 4px; font-style: italic; }
        .math-block { margin: 15px 0; text-align: center; font-size: 1.2em; }
        svg.illustration { width: 100%; max-width: 300px; height: auto; margin: 20px auto; display: block; }

        /* Exercises */
        .exercise-box { background: var(--bg-panel); border: 2px solid var(--border); border-radius: 12px; padding: 25px; margin-top: 20px; animation: fadeIn 0.4s ease-out; }
        .exercise-question { font-size: 1.1rem; margin-bottom: 20px; font-weight: 500; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .option-btn { background: var(--bg-card); border: 2px solid var(--border); border-radius: 12px; padding: 15px; color: var(--text-main); cursor: pointer; font-size: 1rem; transition: 0.2s; text-align: center; }
        .option-btn:hover { border-color: var(--primary); background: #2a4a52; }
        .option-btn.selected { border-color: var(--warning); background: #3a4a32; box-shadow: inset 0 0 10px rgba(88, 204, 2, 0.2); }
        .option-btn.correct { border-color: var(--primary); background: #2a4a22; color: var(--primary); }
        .option-btn.wrong { border-color: var(--danger); background: #4a2a2a; color: var(--danger); }
        
        .input-answer { width: 100%; padding: 15px; background: var(--bg-card); border: 2px solid var(--border); border-radius: 12px; color: white; font-size: 1rem; margin-bottom: 20px; }
        .input-answer:focus { outline: none; border-color: var(--primary); }

        .btn-group { display: flex; gap: 10px; justify-content: space-between; margin-top: 20px; }
        .action-btn { padding: 12px 24px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 1rem; }
        .btn-check { background: var(--primary); color: white; flex-grow: 1; }
        .btn-check:hover { background: var(--primary-dark); }
        .btn-check:disabled { background: #3a5a60; cursor: not-allowed; }
        .btn-nav { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border); }
        .btn-nav:hover { background: #3a5a60; }

        /* Collapse Explanation */
        .explanation-collapse { margin-top: 20px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
        .explanation-toggle { width: 100%; background: var(--bg-card); padding: 15px; text-align: left; color: var(--primary); cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: bold; border: none; }
        .explanation-content { padding: 0 15px; max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out, padding 0.3s ease-out; background: var(--bg-panel); }
        .explanation-content.open { max-height: 500px; padding: 15px; border-top: 1px solid var(--border); }

        /* Print Styles */
        @media print {
            body { background: white; color: black; display: block; height: auto; }
            .sidebar, .reset-btn, .btn-group, .option-btn, .explanation-collapse, .input-answer { display: none !important; }
            .main { padding: 0; }
            .card { border: 1px solid black; box-shadow: none; background: white; }
            .exercise-box { border: 1px solid black; background: white; }
            .print-area { display: block !important; page-break-inside: avoid; margin-bottom: 20px; }
            .print-table { width: 100%; border-collapse: collapse; font-size: 10pt; }
            .print-table th, .print-table td { border: 1px solid black; padding: 5px; text-align: left; }
        }
        .print-area { display: none; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <h2>MATH TUTORING</h2>
            <p>by Deni</p>
        </div>
        <ul class="nav-list" id="navList">
            <!-- Nav items injected by JS -->
        </ul>
        <button class="reset-btn" onclick="resetAllProgress()"><i class="fas fa-trash-alt"></i> Reset All Progress</button>
    </div>

    <div class="main">
        <div class="content-wrapper" id="contentArea">
            <!-- Content injected by JS -->
        </div>
    </div>

    <div class="print-area" id="printArea"></div>

    <!-- KaTeX JS -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <script>
        // --- CORE STATE & LOGIC ---
        let appState = {
            currentSection: 0,
            currentStep: 0, // 0 = theory1, 1-3 = ex1-3, 4 = theory2, 5-7 = ex4-6, 8 = theory3, 9-12 = ex7-10
            answers: {},
            scores: {}
        };

        function saveState() { localStorage.setItem('surdLessonState', JSON.stringify(appState)); }
        function loadState() { 
            const saved = localStorage.getItem('surdLessonState');
            if(saved) appState = JSON.parse(saved); 
        }

        function resetAllProgress() {
            if(confirm("Are you sure you want to reset all progress?")) {
                localStorage.removeItem('surdLessonState');
                appState = { currentSection: 0, currentStep: 0, answers: {}, scores: {} };
                renderNav();
                navigate(0, 0);
            }
        }

        // Shuffle array for random options
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Render Math
        function renderMath() {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false}
                ]
            });
        }

        // --- LESSON DATA STRUCTURE ---
        /*
        type: 'theory' | 'exercise'
        exercise types: 'mcq' (multiple choice), 'input' (text input)
        */
        const LESSON_DATA = [
            // --- SECTION 0: HOME ---
            {
                id: "home",
                title: "Home",
                icon: "fa-house",
                steps: [
                    {
                        type: "theory",
                        content: `
                            <h2><i class="fas fa-chalkboard-user"></i> MATH TUTORING by Deni</h2>
                            <p><strong>Topic:</strong> Visually Unpacking "Surds"<span class="id-lang">Topik: Membongkar "Surds" Secara Visual</span></p>
                            <br>
                            <p>Welcome to today's lesson! Before we begin, let's review our virtual classroom rules:<span class="id-lang">Selamat datang di pelajaran hari ini! Sebelum kita mulai, mari kita tinjau aturan kelas virtual kita:</span></p>
                            <ul style="margin-left: 20px; margin-top: 10px; line-height: 2;">
                                <li>Take turns speaking.<span class="id-lang">Berbicara secara bergantian.</span></li>
                                <li>Ask for permission if you need to leave the class.<span class="id-lang">Meminta izin jika ingin meninggalkan kelas.</span></li>
                                <li>Turn on your camera and microphone when necessary.<span class="id-lang">Menyalakan kamera dan microphone jika diperlukan.</span></li>
                            </ul>
                            <svg class="illustration" viewBox="0 0 200 200">
                                <circle cx="100" cy="100" r="80" fill="#243840" stroke="#58cc02" stroke-width="4"/>
                                <text x="100" y="90" text-anchor="middle" fill="#58cc02" font-size="40">√x</text>
                                <text x="100" y="130" text-anchor="middle" fill="#a0c4b8" font-size="15">Visuals</text>
                            </svg>
                        `
                    }
                ]
            },
            // --- SECTION 1: SPIRAL REVIEW WARM-UP ---
            {
                id: "sec1",
                title: "Spiral Review Warm-up",
                time: "00:00-00:10",
                icon: "fa-rotate",
                steps: [
                    // Theory 1
                    {
                        type: "theory",
                        content: `
                            <h2><i class="fas fa-rotate"></i> Spiral Review: Place Value & Notation</h2>
                            <p>Let's wake up those math muscles with a 'Power Sprint'! First, let's look at Business Place Value. If a company's revenue is $1,250,000,000$, what is the value of the digit 2?<span class="id-lang">Mari kita bangunkan otot matematika kita dengan 'Power Sprint'! Pertama, mari kita lihat Nilai Tempat Bisnis. Jika pendapatan perusahaan adalah $1,250,000,000$, berapakah nilai digit 2?</span></p>
                            <div class="math-block">$1,250,000,000 = 1 \\text{ billion} + 2 \\text{ hundred millions} + \\dots$</div>
                            <p>Second, how do we write that number in scientific notation?<span class="id-lang">Kedua, bagaimana kita menulis angka tersebut dalam notasi ilmiah?</span></p>
                            <div class="math-block">$1.25 \\times 10^9$</div>
                        `
                    },
                    // Ex 1, 2, 3
                    {
                        type: "exercise", id: "s1e1", qType: "mcq",
                        question: "In the number $5,320,000,000$, what is the value of the digit 3?<span class='id-lang'>Pada angka $5,320,000,000$, berapakah nilai digit 3?</span>",
                        options: ["$3 \\text{ million}$", "$30 \\text{ million}$", "$300 \\text{ million}$", "$3 \\text{ billion}$"],
                        answer: "$300 \\text{ million}$",
                        explanation: "The digit 3 is in the hundred millions place. Therefore, its value is $3 \\times 100,000,000 = 300,000,000$ (300 million).<span class='id-lang'>Digit 3 berada di tempat ratusan juta. Oleh karena itu, nilainya adalah $3 \\times 100,000,000 = 300,000,000$ (300 juta).</span>"
                    },
                    {
                        type: "exercise", id: "s1e2", qType: "mcq",
                        question: "Which of these is the correct scientific notation for $4,500,000,000$?<span class='id-lang'>Manakah di antara ini notasi ilmiah yang benar untuk $4,500,000,000$?</span>",
                        options: ["$4.5 \\times 10^8$", "$45 \\times 10^8$", "$4.5 \\times 10^9$", "$0.45 \\times 10^{10}$"],
                        answer: "$4.5 \\times 10^9$",
                        explanation: "Move the decimal point so there's one non-zero digit to the left: 4.5. Count the jumps (9 jumps right), so it's $4.5 \\times 10^9$.<span class='id-lang'>Pindahkan titik desimal agar ada satu digit bukan nol di sebelah kiri: 4.5. Hitung lompatan (9 lompatan ke kanan), jadi hasilnya $4.5 \\times 10^9$.</span>"
                    },
                    {
                        type: "exercise", id: "s1e3", qType: "input",
                        question: "A company profit is $10^7$. How much is this in millions? (e.g., answer '5' for 5 million)<span class='id-lang'>Keuntungan perusahaan adalah $10^7$. Berapa kah ini dalam jutaan? (misal, jawab '5' untuk 5 juta)</span>",
                        answer: "10",
                        explanation: "$10^7 = 10,000,000$. To find how many millions, divide by $1,000,000$. $10,000,000 / 1,000,000 = 10$ million.<span class='id-lang'>$10^7 = 10,000,000$. Untuk mencari berapa juta, bagi dengan $1,000,000$. $10,000,000 / 1,000,000 = 10$ juta.</span>"
                    },
                    // Theory 2
                    {
                        type: "theory",
                        content: `
                            <h2><i class="fas fa-rotate"></i> Spiral Review: Perfect Squares</h2>
                            <p>Now, let's pivot to our last session on Surds. If I have a square with an area of 25, what is the side length? It's 5, because $5 \\times 5 = 25$.<span class="id-lang">Sekarang, mari kita beralih ke sesi terakhir kita tentang Surds. Jika saya memiliki persegi dengan luas 25, berapakah panjang sisinya? Yaitu 5, karena $5 \\times 5 = 25$.</span></p>
                            <p>But what if the area is 2? The side length is $\sqrt{2}$. Can you draw a rough square and label the side for Area = 2?<span class="id-lang">Tapi bagaimana jika luasnya 2? Panjang sisinya adalah $\\sqrt{2}$. Bisakah kamu menggambar persegi kasar dan memberi label sisi untuk Luas = 2?</span></p>
                            <svg class="illustration" viewBox="0 0 150 150">
                                <rect x="25" y="25" width="100" height="100" fill="#243840" stroke="#58cc02" stroke-width="2" rx="5"/>
                                <text x="75" y="85" text-anchor="middle" fill="#ffffff" font-size="16">A = 2</text>
                                <text x="75" y="20" text-anchor="middle" fill="#ffc800" font-size="14">s = √2</text>
                            </svg>
                        `
                    },
                    // Ex 4, 5, 6
                    {
                        type: "exercise", id: "s1e4", qType: "mcq",
                        question: "If a square has an area of 49, what is its exact side length?<span class='id-lang'>Jika sebuah persegi memiliki luas 49, berapakah panjang sisi pastinya?</span>",
                        options: ["$7$", "$\\sqrt{49}$", "$6$", "$49$"],
                        answer: "$7$",
                        explanation: "Since $7 \\times 7 = 49$, the side length is exactly 7. Note: $\\sqrt{49}$ is also mathematically correct but simplified it is 7.<span class='id-lang'>Karena $7 \\times 7 = 49$, panjang sisinya tepat 7. Catatan: $\\sqrt{49}$ juga benar secara matematis tetapi disederhanakan menjadi 7.</span>"
                    },
                    {
                        type: "exercise", id: "s1e5", qType: "mcq",
                        question: "A square has an area of 13. Its side length is $\sqrt{13}$. Is $\sqrt{13}$ closer to 3 or 4?<span class='id-lang'>Sebuah persegi memiliki luas 13. Panjang sisinya adalah $\\sqrt{13}$. Apakah $\\sqrt{13}$ lebih dekat ke 3 atau 4?</span>",
                        options: ["3", "4"],
                        answer: "4",
                        explanation: "Since $3^2 = 9$ and $4^2 = 16$, 13 is closer to 16. Thus, $\\sqrt{13}$ is closer to 4.<span class='id-lang'>Karena $3^2 = 9$ dan $4^2 = 16$, 13 lebih dekat ke 16. Dengan demikian, $\\sqrt{13}$ lebih dekat ke 4.</span>"
                    },
                    {
                        type: "exercise", id: "s1e6", qType: "mcq",
                        question: "Which of the following represents the side length of a square with Area = 90?<span class='id-lang'>Manakah yang mewakili panjang sisi persegi dengan Luas = 90?</span>",
                        options: ["$9$", "$45$", "$\\sqrt{90}$", "$90$"],
                        answer: "$\\sqrt{90}$",
                        explanation: "By definition, if Area = $x$, side length = $\\sqrt{x}$. So for Area 90, side is $\\sqrt{90}$.<span class='id-lang'>Berdasarkan definisi, jika Luas = $x$, panjang sisi = $\\sqrt{x}$. Jadi untuk Luas 90, sisinya adalah $\\sqrt{90}$.</span>"
                    },
                    // Theory 3
                    {
                        type: "theory",
                        content: `
                            <h2><i class="fas fa-rotate"></i> Initial Visualization of $\sqrt{2}$</h2>
                            <p>Numbers like $\sqrt{2}$ are called <strong>irrational numbers</strong> or <strong>surds</strong>. They cannot be written as a simple fraction, and their decimals go on forever without repeating.<span class="id-lang">Bilangan seperti $\\sqrt{2}$ disebut <strong>bilangan irasional</strong> atau <strong>surds</strong>. Bilangan ini tidak dapat ditulis sebagai pecahan sederhana, dan desimalnya berlanjut selamanya tanpa berulang.</span></p>
                            <p>$\sqrt{2} \approx 1.41421356...$<span class="id-lang">$\\sqrt{2} \\approx 1.41421356...$</span></p>
                            <p>Even though it's an infinite decimal, it represents a very specific, exact physical length!<span class="id-lang">Meskipun desimalnya tak terbatas, ia mewakili panjang fisik yang sangat spesifik dan pasti!</span></p>
                        `
                    },
                    // Ex 7, 8, 9, 10
                    {
                        type: "exercise", id: "s1e7", qType: "mcq",
                        question: "Which of these is a surd?<span class='id-lang'>Manakah di antara ini yang merupakan surd?</span>",
                        options: ["$\\sqrt{4}$", "$\\sqrt{9}$", "$\\sqrt{16}$", "$\\sqrt{7}$"],
                        answer: "$\\sqrt{7}$",
                        explanation: "A surd is an irrational root. $\\sqrt{4}=2$, $\\sqrt{9}=3$, $\\sqrt{16}=4$ are rational. $\\sqrt{7}$ cannot be simplified to a whole number or fraction.<span class='id-lang'>Surd adalah akar irasional. $\\sqrt{4}=2$, $\\sqrt{9}=3$, $\\sqrt{16}=4$ adalah rasional. $\\sqrt{7}$ tidak dapat disederhanakan menjadi bilangan bulat atau pecahan.</span>"
                    },
                    {
                        type: "exercise", id: "s1e8", qType: "mcq",
                        question: "Why can't we write $\sqrt{2}$ as an exact decimal?<span class='id-lang'>Mengapa kita tidak bisa menulis $\\sqrt{2}$ sebagai desimal pasti?</span>",
                        options: ["Because it's a negative number.", "Because its decimal expansion is infinite and non-repeating.", "Because 2 is an even number.", "Because it's too small."],
                        answer: "Because its decimal expansion is infinite and non-repeating.",
                        explanation: "Irrational numbers (surds) have decimal expansions that neither terminate nor repeat.<span class='id-lang'>Bilangan irasional (surd) memiliki ekspansi desimal yang tidak berakhir dan tidak berulang.</span>"
                    },
                    {
                        type: "exercise", id: "s1e9", qType: "mcq",
                        question: "If Area = 13, side = $\sqrt{13}$. Is $\sqrt{13}$ closer to 3 or 4?<span class='id-lang'>Jika Luas = 13, sisi = $\\sqrt{13}$. Apakah $\\sqrt{13}$ lebih dekat ke 3 atau 4?</span>",
                        options: ["3", "4"],
                        answer: "4",
                        explanation: "$3^2 = 9$ and $4^2 = 16$. 13 is closer to 16 than to 9, so $\\sqrt{13}$ is closer to 4.<span class='id-lang'>$3^2 = 9$ dan $4^2 = 16$. 13 lebih dekat ke 16 daripada 9, jadi $\\sqrt{13}$ lebih dekat ke 4.</span>"
                    },
                    {
                        type: "exercise", id: "s1e10", qType: "input",
                        question: "Between which two whole numbers does $\sqrt{5}$ lie? (Answer in format 'a,b' e.g., '2,3')<span class='id-lang'>Di antara dua bilangan bulat apa $\\sqrt{5}$ berada? (Jawab dalam format 'a,b' misalnya '2,3')</span>",
                        answer: "2,3",
                        explanation: "$2^2 = 4$ and $3^2 = 9$. Since 5 is between 4 and 9, $\\sqrt{5}$ is between 2 and 3.<span class='id-lang'>$2^2 = 4$ dan $3^2 = 9$. Karena 5 di antara 4 dan 9, $\\sqrt{5}$ di antara 2 dan 3.</span>"
                    }
                ]
            },
			
            // --- SECTION 2: INTRODUCTION & REAL-WORLD CONNECTION ---
            {
                id: "sec2",
                title: "Introduction & Real-World",
                time: "00:10-00:15",
                icon: "fa-globe",
                steps: [
                    // Theory 1
                    {
                        type: "theory",
                        content: `
                            <h2><i class="fas fa-globe"></i> The Architect's Dilemma</h2>
                            <p>Imagine you are an architect designing a high-end minimalist plaza. You want a square garden with an area of exactly 7 square meters. You go to the hardware store for a border fence. The store asks: "What is the exact side length?"<span class="id-lang">Bayangkan kamu adalah arsitek yang mendesain plaza minimalis kelas atas. Kamu menginginkan taman persegi dengan luas tepat 7 meter persegi. Kamu pergi ke toko perangkat keras untuk pagar pembatas. Toko tersebut bertanya: "Berapa panjang sisi yang tepat?"</span></p>
                            <p>You can't just say 2.6 or 2.64 because it's not exact. This is where <strong>'Surds'</strong> come in. They are the 'hidden' lengths in nature and design that decimals can't perfectly capture.<span class="id-lang">Kamu tidak bisa hanya mengatakan 2.6 atau 2.64 karena itu tidak tepat. Di sinilah <strong>'Surds'</strong> berperan. Mereka adalah panjang 'tersembunyi' di alam dan desain yang tidak dapat ditangkap sempurna oleh desimal.</span></p>
                        `
                    },
                    // Ex 1, 2, 3
                    {
                        type: "exercise", id: "s2e1", qType: "mcq",
                        question: "Why is a decimal like 2.64 insufficient for the exact side length of a square with Area = 7?<span class='id-lang'>Mengapa desimal seperti 2.64 tidak cukup untuk panjang sisi tepat persegi dengan Luas = 7?</span>",
                        options: ["Because 2.64 is too small.", "Because decimals are always wrong.", "Because 2.64 × 2.64 does not equal exactly 7.", "Because the store doesn't accept decimals."],
                        answer: "Because 2.64 × 2.64 does not equal exactly 7.",
                        explanation: "An exact side length must multiply by itself to give exactly 7. $2.64 \\times 2.64 = 6.9696$, which is close, but not exactly 7.<span class='id-lang'>Panjang sisi yang tepat harus dikalikan dengan dirinya sendiri untuk menghasilkan tepat 7. $2.64 \\times 2.64 = 6.9696$, yang mendekati, tapi tidak tepat 7.</span>"
                    },
                    {
                        type: "exercise", id: "s2e2", qType: "mcq",

                if(isComplete) li.classList.add('completed');

            const section = LESSON_DATA[sIndex];
            if(!section.steps) return false;
            const exercises = section.steps.filter(s => s.type === 'exercise');

            return exercises.every(ex => appState.answers[ex.id] !== undefined);

                nextBtn.style.justifyContent = 'flex-end';
				nextBtn.innerHTML = `
					${appState.currentStep > 0 ? `<button class="action-btn btn-nav" onclick="prevStep()"><i class="fas fa-arrow-left"></i> Previous</button>` : '<div></div>'}
					<button class="action-btn btn-nav" onclick="nextStep()" style="margin-left: auto; margin-right: 10px;">Next <i class="fas fa-forward"></i></button>
					<button class="action-btn btn-check" onclick="nextStep()">Continue <i class="fas fa-arrow-right"></i></button>
				`;
                area.appendChild(nextBtn);
            } else {
                renderExercise(step);
            }
            renderMath();
        }

        function renderExercise(ex) {
            const area = document.getElementById('contentArea');
            const isAnswered = appState.answers[ex.id] !== undefined;
            const userAnswer = appState.answers[ex.id];
            const isCorrect = appState.scores[ex.id] === true;

            let html = `<div class="exercise-box">`;
            html += `<div class="exercise-question">${ex.question}</div>`;
            
            if(ex.qType === 'mcq') {
                // Randomize options on first render, but keep consistent if revisiting
                let options = shuffleArray(ex.options);
                html += `<div class="options-grid">`;
                options.forEach(opt => {
                    let optClass = 'option-btn';
                    if(isAnswered && opt === ex.answer) optClass += ' correct';
                    if(isAnswered && opt === userAnswer && opt !== ex.answer) optClass += ' wrong';
                    if(!isAnswered && userAnswer === opt) optClass += ' selected';
                    
                    const disabled = isAnswered ? 'disabled' : '';
                    html += `<button class="${optClass}" ${disabled} onclick="selectOption('${ex.id}', this, '${opt.replace(/'/g, "\\'")}')">${opt}</button>`;
                });
                html += `</div>`;
            } else { // input
                const disabled = isAnswered ? 'disabled' : '';
                const val = isAnswered ? userAnswer : '';
				html += `<div style="display: flex; gap: 10px; align-items: center; margin-bottom: 20px;">
							<input type="text" class="input-answer" id="input_${ex.id}" value="${val}" ${disabled} onkeyup="if(event.key==='Enter')checkAnswer('${ex.id}', 'input')" style="margin-bottom: 0 !important; flex-grow: 1;">
							<button class="action-btn btn-nav" onclick="insertSurd('${ex.id}')" ${disabled} title="Insert Square Root" style="font-size: 1.2rem; padding: 12px 15px; flex-shrink: 0;">√</button>
						 </div>`;
            }

			// Check Button & Navigation
			html += `<div class="btn-group" style="flex-wrap: wrap; gap: 8px;">`;
			
			// 1. Prev Button
			html += `<button class="action-btn btn-nav" onclick="prevStep()"><i class="fas fa-arrow-left"></i> Prev</button>`;
			
			// 2. Reset Button (Hanya muncul jika sudah dijawab)
			if(isAnswered) {
				html += `<button class="action-btn btn-nav" onclick="resetExercise('${ex.id}')" style="background: var(--danger); color: white; border:none;"><i class="fas fa-redo"></i> Reset</button>`;
			}

			// 3. Next/Skip Button (Selalu muncul agar bisa lompat soal)
			html += `<button class="action-btn btn-nav" onclick="nextStep()" style="margin-left: auto;">Next <i class="fas fa-forward"></i></button>`;

			// 4. Check/Submit Button (Hanya muncul jika belum dijawab)
			if(!isAnswered) {
				html += `<button class="action-btn btn-check" id="checkBtn_${ex.id}" onclick="checkAnswer('${ex.id}', '${ex.qType}')">Check</button>`;
			}
			
			html += `</div>`;

            // Explanation Collapse
            if(isAnswered) {
                html += `
                <div class="explanation-collapse" style="margin-top: 20px;">
                    <button class="explanation-toggle" onclick="toggleCollapse(this)"><span>${isCorrect ? '<i class="fas fa-check-circle" style="color:var(--primary)"></i> Correct!' : '<i class="fas fa-times-circle" style="color:var(--danger)"></i> Incorrect'}</span> Show Explanation <i class="fas fa-chevron-down"></i></button>
                    <div class="explanation-content">${ex.explanation}</div>
                </div>`;
            }

            html += `</div>`;
            area.innerHTML = html;
        }

        function selectOption(exId, btn, optValue) {
            if(appState.answers[exId] !== undefined) return; // already answered
            const parent = btn.parentElement;
            Array.from(parent.children).forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            // temporarily store selection
            btn.dataset.selected = optValue;
        }

		function checkAnswer(exId, qType) {
			let userAnswer = '';
			if(qType === 'mcq') {
				const selected = document.querySelector('.option-btn.selected');
				if(!selected) return alert("Please select an answer first!");
				userAnswer = selected.dataset.selected;
			} else {
				userAnswer = document.getElementById(`input_${exId}`).value.trim();
				if(!userAnswer) return alert("Please type an answer!");
			}

			// Find exercise data
			let exData;
			LESSON_DATA.forEach(s => s.steps.forEach(st => { if(st.id === exId) exData = st; }));
			
			// Smart Checking: Normalize strings, ignore spaces, and accept surd variations (sqrt, v, akar)
			const normalize = (str) => {
				let s = str.toString().trim().toLowerCase().replace(/\s+/g, '');
				s = s.replace(/sqrt/g, '√').replace(/akar/g, '√').replace(/v/g, '√');
				return s;
			};
			const isCorrect = normalize(userAnswer) === normalize(exData.answer);
			
			appState.answers[exId] = userAnswer;
			appState.scores[exId] = isCorrect;
			saveState();

			renderContent(); // Re-render to show correct/wrong states and explanation
		}

        function toggleCollapse(btn) {
            const content = btn.nextElementSibling;
            content.classList.toggle('open');
        }

        function nextStep() {
            const section = LESSON_DATA[appState.currentSection];
            if(appState.currentStep < section.steps.length - 1) {
                appState.currentStep++;
                saveState();
                renderNav();
                renderContent();
            } else {
                // Move to next section
                if(appState.currentSection < LESSON_DATA.length - 1) {
                    navigate(appState.currentSection + 1, 0);
                } else {
                    alert("You have completed the lesson!");
                }
            }
        }

        function prevStep() {
            if(appState.currentStep > 0) {
                appState.currentStep--;
                saveState();
                renderNav();
                renderContent();
            } else if(appState.currentSection > 0) {
                const prevSection = LESSON_DATA[appState.currentSection - 1];
                navigate(appState.currentSection - 1, prevSection.steps.length - 1);
            }
        }

        // --- PRINT LOGIC & UI INJECTION ---
        // This function injects the "Print Result" button into Assignment sections
		function injectPrintButton() {
			const section = LESSON_DATA[appState.currentSection];
			// Always show print button in Assignment, even if skipped
			if(section.isAssignment) {
				const existingBtn = document.getElementById('printBtnAssignment');
				if(!existingBtn) {
					const contentArea = document.querySelector('.content-wrapper');
					const printBtn = document.createElement('button');
					printBtn.id = 'printBtnAssignment';
					printBtn.className = 'action-btn btn-check';
					printBtn.style.marginBottom = '20px';
					printBtn.innerHTML = `<i class="fas fa-print"></i> Print Result`;
					printBtn.onclick = () => printAssignment(section.id);
					contentArea.insertBefore(printBtn, contentArea.firstChild);
				}
			}
		}

        // Print window generation
        function printAssignment(sectionId) {
            const section = LESSON_DATA.find(s => s.id === sectionId);
            if(!section) return;
            
            let exercises = section.steps.filter(s => s.type === 'exercise');
            let score = 0;
            let tableRows = '';
            
            exercises.forEach((ex, i) => {
                const isCorrect = appState.scores[ex.id] === true;
                if(isCorrect) score++;
				const stuAns = appState.answers[ex.id] || '<em style="color:#888;">Skipped</em>';
				const note = appState.answers[ex.id] !== undefined ? (isCorrect ? '✔️' : '❌') : '—';
                // Strip Indonesian translation for the printout
                const qText = ex.question.replace(/<span class="id-lang">.*?<\/span>/g, '').replace(/<br>/g, ' ');
                tableRows += `<tr>
                    <td>${i+1}</td>
                    <td>${qText}</td>
                    <td>${stuAns}</td>
                    <td>${ex.answer}</td>
                    <td style="text-align:center; font-size:1.2em;">${note}</td>
                </tr>`;
            });

            const printHTML = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Print Result - ${section.title}</title>
                    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
                    <style>
                        body { font-family: 'Segoe UI', sans-serif; font-size: 10pt; margin: 30px; color: #000; }
                        h2 { margin-bottom: 5px; font-size: 14pt; }
                        .meta { margin-bottom: 15px; line-height: 1.6; font-size: 10pt; }
                        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 9pt; }
                        th, td { border: 1px solid black; padding: 6px; text-align: left; vertical-align: top; }
                        th { background: #f0f0f0; }
                        .footer { margin-top: 40px; font-size: 10pt; }
                        @page { size: A4; margin: 15mm; }
                    </style>
                </head>
                <body>
                    <h2>MATH TUTORING by Deni</h2>
                    <div class="meta">
                        <strong>Name:</strong> ___________________________ <br>
                        <strong>Date:</strong> ___________________________ <br>
                        <strong>Topic:</strong> Visually Unpacking "Surds" <br>
                        <strong>Assignment Group:</strong> ${section.title} <br>
                        <strong>Score:</strong> ${score} / ${exercises.length}
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th width="5%">No.</th>
                                <th width="40%">Question</th>
                                <th width="20%">Student Answer</th>
                                <th width="20%">Correct Answer</th>
                                <th width="15%">Note</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableRows}
                        </tbody>
                    </table>
                    <div class="footer">
                        <p>Checked by,</p>
                        <br><br>
                        <p><strong>Deni</strong></p>
                    </div>
                    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"><\/script>
                    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"><\/script>
                    <script>
                        renderMathInElement(document.body, { delimiters: [{left: '$$', right: '$$', display: true},{left: '$', right: '$', display: false}] });
                        setTimeout(()=> window.print(), 800);
                    <\/script>
                </body>
                </html>
            `;
            
            const win = window.open('', '_blank');
            win.document.write(printHTML);
            win.document.close();
        }

        // Override the standard renderContent to also trigger print button injection
        const originalRenderContent = renderContent;
		renderContent = function() {
			originalRenderContent();
			injectPrintButton();
			// renderMath() is already called inside originalRenderContent, no need to call twice
		};

		// --- INSERT SURD SYMBOL FUNCTION ---
		function insertSurd(exId) {
			const input = document.getElementById(`input_${exId}`);
			if(input) {
				input.value += '√';
				input.focus();
			}
		}

		// --- RESET EXERCISE FUNCTION ---
		function resetExercise(exId) {
			if(confirm("Reset this question? Your current answer will be cleared.")) {
				delete appState.answers[exId];
				delete appState.scores[exId];
				saveState();
				renderNav(); // Update sidebar completion status
				renderContent(); // Re-render the exercise
			}
		}

		// --- INIT ---
        loadState();
        renderNav();
        navigate(appState.currentSection, appState.currentStep);

    </script>
</body>
</html>
