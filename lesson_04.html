									<li>Simplify (Neutralize) <span class="idn font-normal">Sederhanakan (Netralisasi)</span></li>
								</ol>
							</div>
						`
					},
					{
						type: 'theory',
						content: `
							<div class="mt-6 p-6 bg-gradient-to-r from-sky-50 to-blue-50 rounded-lg border border-sky-200 text-center shadow-sm">
								<h4 class="font-bold text-sky-800 mb-2">What was your biggest "Aha!" moment today?</h4>
								<p class="idn">Apa momen "Aha!" terbesar Anda hari ini?</p>
								<div class="mt-6">
									<p class="font-semibold mb-4 text-gray-700">Access your post-session notes and homework here:</p>
									<p class="idn">Akses catatan pasca-sesi dan pekerjaan rumah Anda di sini:</p>
									<a href="https://learn.algonova.id/login" target="_blank" class="inline-block mt-4 bg-sky-600 text-white px-8 py-3 rounded-lg font-bold hover:bg-sky-700 transition transform hover:scale-105 shadow-md">
										<i class="fas fa-external-link-alt mr-2"></i> Go to learn.algonova.id
									</a>
								</div>
							</div>
						`
					}
				]
			}
            // SECTIONS 1 to 6, ASSIGNMENTS 1-5, AND REFLECTION WILL BE INJECTED HERE
        ];

        // --- RENDERING ENGINE ---
        function renderApp() {
            renderNavbar();
            renderContent();
            updateNavButtons();
        }

        function renderNavbar() {
            const container = document.getElementById('nav-container');
            container.innerHTML = '';
            
            COURSE_DATA.forEach((section, sIdx) => {
                const isAssignment = section.id.includes('assign');
                const isReflection = section.id.includes('reflect');
                
                let icon = 'fa-book-open';
                if(isAssignment) icon = 'fa-file-alt';
                if(isReflection) icon = 'fa-flag-checkered';
                if(sIdx === 0) icon = 'fa-home';

                const div = document.createElement('div');
                div.className = `nav-item p-3 mb-1 rounded-r-lg cursor-pointer flex items-center gap-3 ${appState.currentSection === sIdx ? 'active' : ''}`;
                div.onclick = () => jumpTo(sIdx, 0);
                
                let statusIcon = '';
                if(sIdx > 0 && isSectionComplete(sIdx)) statusIcon = `<i class="fas fa-check-circle text-green-500 ml-auto"></i>`;
                
                div.innerHTML = `
                    <i class="fas ${icon} text-gray-400"></i>
                    <div class="flex-1">
                        <div class="text-sm font-medium text-gray-700">${section.title}</div>
                        ${section.time ? `<div class="text-xs text-gray-400">${section.time}</div>` : ''}
                    </div>
                    ${statusIcon}
                `;
                container.appendChild(div);
            });
        }

        function renderContent() {
            const section = COURSE_DATA[appState.currentSection];
            const item = section.items[appState.currentItem];
            const area = document.getElementById('content-area');
            
            document.getElementById('section-title').innerText = section.title;
            document.getElementById('section-subtitle').innerText = section.time ? `Time: ${section.time}` : '';
            
            // Progress bar
            const isExercise = item && item.type === 'exercise';
            document.getElementById('progress-bar-container').classList.toggle('hidden', !isExercise);
            if(isExercise) updateProgressBar();

            // Print Button Visibility (Hanya muncul di Assignment)
            const isAssignmentSection = section.id.includes('assign');
            document.getElementById('btn-print').classList.toggle('hidden', !isAssignmentSection);

            // Check button visibility
            const hasAnswer = appState.answers[`${appState.currentSection}-${appState.currentItem}`] !== undefined;
            document.getElementById('btn-check').toggleAttribute('hidden', !isExercise || hasAnswer);
            
            area.className = 'p-6 md:p-10 max-w-3xl mx-auto content-enter'; // trigger animation
            area.innerHTML = '';

            if (item.type === 'theory') {
                area.innerHTML = `<div class="theory-card bg-white p-6 rounded-xl shadow-sm border border-gray-100">${item.content}</div>`;
            } else if (item.type === 'exercise') {
                renderExercise(area, item);
            }
            
            // Render KaTeX
            renderMathInElement(area, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false}
                ]
            });
        }

        function renderExercise(container, item) {
            const key = `${appState.currentSection}-${appState.currentItem}`;
            const userAnswer = appState.answers[key];
            const isAnswered = userAnswer !== undefined;
            const isCorrect = userAnswer === item.correct;

            let html = `<div class="exercise-card bg-white p-6 rounded-xl shadow-sm border ${isAnswered ? (isCorrect ? 'border-green-200' : 'border-red-200') : 'border-sky-100'}">`;
            html += `<div class="flex items-center gap-2 mb-4 text-sky-800 font-bold"><i class="fas fa-brain"></i> Exercise</div>`;
            html += `<div class="question mb-6 text-lg text-gray-800">${item.question}</div>`;
            
           // Options
            let options = item.options;
            // We use a seeded random or pre-shuffled so it doesn't change on re-render. 
            // For simplicity, we shuffle based on key as seed (simple array index check)
            if(!item.shuffled) {
                item.options = shuffleArray(item.options, key);
                item.shuffled = true;
            }
            options = item.options;

            html += `<div class="options-container space-y-3">`;
            options.forEach((opt, idx) => {
                let classes = `option-btn border-2 border-gray-200 p-3 rounded-lg flex items-center gap-3 cursor-pointer`;
                if(isAnswered) {
                    classes += ` disabled pointer-events-none`;
                    if(opt === item.correct) classes += ` correct`;
                    else if(opt === userAnswer && !isCorrect) classes += ` incorrect`;
                } else {
                    classes += ` hover:bg-sky-50`;
                }
                html += `<div class="${classes}" onclick="selectOption('${opt}', this)">
                    <div class="w-8 h-8 rounded-full border-2 border-gray-300 flex items-center justify-center text-sm font-bold">${String.fromCharCode(65 + idx)}</div>
                    <div class="flex-1">${opt}</div>
                </div>`;
            });
            html += `</div>`;

            // Explanation Collapse & Reset Button
            if(isAnswered) {
                html += `<div class="mt-6 border-t border-gray-100 pt-4">
                    <div class="flex justify-between items-center mb-3">
                        <button onclick="toggleCollapse(this)" class="text-sm text-sky-600 hover:text-sky-800 font-semibold flex items-center gap-2 transition">
                            <i class="fas fa-lightbulb"></i> ${isCorrect ? 'Correct! See explanation' : 'Incorrect. See explanation'} 
                            <i class="fas fa-chevron-down text-xs"></i>
                        </button>
                        <button onclick="resetCurrentExercise()" class="text-sm text-amber-600 hover:text-amber-800 font-semibold flex items-center gap-2 transition">
                            <i class="fas fa-undo-alt"></i> Try Again
                        </button>
                    </div>
                    <div class="collapse-content text-gray-600 text-sm leading-relaxed">
                        <p class="pb-2 border-b border-gray-50">${item.explanation}</p>
                    </div>
                </div>`;
            }
            
            html += `</div>`;
            container.innerHTML = html;
        }

        // --- INTERACTIONS ---
        function selectOption(opt, element) {
            // Visual selection (optional, since we check immediately or on button click)
            // We will use Check Answer button!>
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.classList.remove('border-sky-500', 'bg-sky-50');
                btn.querySelector('.w-8').classList.remove('bg-sky-500', 'text-white');
                btn.querySelector('.w-8').classList.add('border-gray-300');
            });
            element.classList.add('border-sky-500', 'bg-sky-50');
            element.querySelector('.w-8').classList.remove('border-gray-300');
            element.querySelector('.w-8').classList.add('bg-sky-500', 'text-white');
            
            window._tempSelection = opt;
            document.getElementById('btn-check').classList.remove('hidden');
            document.getElementById('btn-check').disabled = false;
        }

        function checkAnswer() {
            if(!window._tempSelection) return;
            const key = `${appState.currentSection}-${appState.currentItem}`;
            appState.answers[key] = window._tempSelection;
            
            const item = COURSE_DATA[appState.currentSection].items[appState.currentItem];
            const isCorrect = window._tempSelection === item.correct;
            
            // Save score for assignments
            if(COURSE_DATA[appState.currentSection].id.includes('assign')) {
                if(!appState.scores[key]) appState.scores[key] = isCorrect ? 1 : 0;
            }

            window._tempSelection = null;
            saveState();
            renderContent();
            updateNavButtons();
            renderNavbar(); // update checkmarks
        }

        function resetCurrentExercise() {
            const key = `${appState.currentSection}-${appState.currentItem}`;
            // Hapus jawaban dan skor untuk exercise ini
            delete appState.answers[key];
            delete appState.scores[key];
            
            // Reset state sementara
            window._tempSelection = null;
            
            // Simpan dan render ulang
            saveState();
            renderContent();
            updateNavButtons();
        }

        function toggleCollapse(btn) {
            // Target konten collapse berada di sebelah parent wrapper
            const content = btn.parentElement.nextElementSibling;
            content.classList.toggle('open');
            const icon = btn.querySelector('.fa-chevron-down, .fa-chevron-up');
            icon.classList.toggle('fa-chevron-down');
            icon.classList.toggle('fa-chevron-up');
        }

        function jumpTo(sIdx, iIdx) {
            appState.currentSection = sIdx;
            appState.currentItem = iIdx;
            window._tempSelection = null;
            saveState();
            renderApp();
        }

        function nextItem() {
            const section = COURSE_DATA[appState.currentSection];
            if (appState.currentItem < section.items.length - 1) {
                appState.currentItem++;
            } else if (appState.currentSection < COURSE_DATA.length - 1) {
                appState.currentSection++;
                appState.currentItem = 0;
            }
            window._tempSelection = null;
            saveState();
            renderApp();
        }

        function prevItem() {
            if (appState.currentItem > 0) {
                appState.currentItem--;
            } else if (appState.currentSection > 0) {
                appState.currentSection--;
                appState.currentItem = COURSE_DATA[appState.currentSection].items.length - 1;
            }
            window._tempSelection = null;
            saveState();
            renderApp();
        }

        function updateNavButtons() {
            const section = COURSE_DATA[appState.currentSection];
            const item = section.items[appState.currentItem];
            const isExercise = item && item.type === 'exercise';
            const isAnswered = appState.answers[`${appState.currentSection}-${appState.currentItem}`] !== undefined;

            // Prev
            document.getElementById('btn-prev').disabled = (appState.currentSection === 0 && appState.currentItem === 0);

            // Next
            let canNext = true;
            // (Kunci Duolingo dihapus agar siswa bisa skip exercise)
            if(appState.currentSection === COURSE_DATA.length - 1 && appState.currentItem === section.items.length - 1) canNext = false;
            document.getElementById('btn-next').disabled = !canNext;
            
            // Check
            document.getElementById('btn-check').hidden = !isExercise || isAnswered;
        }

        function updateProgressBar() {
            // Overall progress logic
            let totalEx = 0, doneEx = 0;
            COURSE_DATA.forEach((s, sI) => {
                s.items.forEach((it, iI) => {
                    if(it.type === 'exercise') {
                        totalEx++;
                        if(appState.answers[`${sI}-${iI}`] !== undefined) doneEx++;
                    }
                });
            });
            const pct = totalEx === 0 ? 0 : (doneEx / totalEx) * 100;
            document.getElementById('progress-bar').style.width = `${pct}%`;
        }

        function isSectionComplete(sIdx) {
            const section = COURSE_DATA[sIdx];
            return section.items.every((item, iIdx) => {
                if(item.type === 'theory') return true;
                return appState.answers[`${sIdx}-${iIdx}`] !== undefined;
            });
        }

        // --- UTILS ---
        function shuffleArray(array, seed) {
            // Simple deterministic shuffle for options so they don't jump on re-render
            let hash = 0;
            for (let i = 0; i < seed.length; i++) { hash = ((hash << 5) - hash) + seed.charCodeAt(i); hash |= 0; }
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                let j = Math.abs(hash + i) % (i + 1);
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function resetAllProgress() {
            if(confirm("Are you sure? This will delete all your answers and progress.")) {
                localStorage.removeItem('surdsAppState');
                appState = { currentSection: 0, currentItem: 0, answers: {}, scores: {} };
                // Reset shuffle flags
                COURSE_DATA.forEach(s => s.items.forEach(i => i.shuffled = false));
                renderApp();
            }
        }

        function saveState() {
            localStorage.setItem('surdsAppState', JSON.stringify(appState));
        }

        function loadState() {
            const saved = localStorage.getItem('surdsAppState');
            if(saved) {
                appState = JSON.parse(saved);
            }
        }

        // --- HELPER: PRE-RENDER KATEX FOR PRINT ---
        function renderKatexToString(text) {
            if (!text || text === '-') return '-';
            // Cari teks di antara $ ... $ dan render menggunakan KaTeX
            return text.replace(/\$(.*?)\$/g, (match, latex) => {
                try {
                    return katex.renderToString(latex, { throwOnError: false });
                } catch (e) {
                    return match; // Jika error, kembalikan teks asli
                }
            });
        }

        // --- PRINT LOGIC (FINAL VERSION - PRE-RENDERED) ---
        function printAssignment(assignIndex) {
            const section = COURSE_DATA[assignIndex];
            if(!section) return;

            const printWindow = window.open('', '_blank');
            let tableRows = '';
            let score = 0;
            const totalQ = section.items.length;

            section.items.forEach((item, idx) => {
                const key = `${assignIndex}-${idx}`;
                const userAns = appState.answers[key] || '-';
                const correctAns = item.correct;
                const isCorrect = appState.scores[key] === 1;
                if(isCorrect) score++;
                const noteSymbol = isCorrect ? '<span style="color:green;">&#10004;</span>' : (appState.answers[key] ? '<span style="color:red;">&#10008;</span>' : '-');

                // Olah teks math mentah menjadi HTML visual menggunakan helper
                const pQuestion = renderKatexToString(item.question);
                const pUserAns = renderKatexToString(userAns);
                const pCorrectAns = renderKatexToString(correctAns);

                tableRows += `<tr>
                    <td style="text-align:center;">${idx + 1}</td>
                    <td>${pQuestion}</td>
                    <td>${pUserAns}</td>
                    <td>${pCorrectAns}</td>
                    <td style="text-align:center;">${noteSymbol}</td>
                </tr>`;
            });

            const html = `
            <!DOCTYPE html>
            <html>
            <head>
                <title>Print Result - ${section.title}</title>
                <!-- Muat hanya CSS KaTeX agar tampilan math rapi, tanpa JS untuk hindari error file:// -->
                <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
                <style>
                    @page { size: A4; margin: 15mm; }
                    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 11pt; line-height: 1.4; }
                    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 10pt; }
                    th, td { border: 1px solid #000; padding: 6px 8px; text-align: left; }
                    th { background-color: #f0f0f0; font-weight: bold; }
                    h2 { margin: 0; font-size: 16pt; }
                    .info { margin-top: 4px; font-size: 11pt; }
                    .info strong { display: inline-block; width: 150px; }
                </style>
            </head>
            <body>
                <h2>MATH TUTORING by Deni</h2>
                <div class="info"><strong>Name:</strong> ______________________________________</div>
                <div class="info"><strong>Date:</strong> ______________________________________</div>
                <div class="info"><strong>Topic:</strong> Simplifying Surds (Factors & Multiples)</div>
                <div class="info"><strong>Assignment Group:</strong> ${section.title}</div>
                <div class="info"><strong>Score:</strong> ${score} / ${totalQ}</div>

                <table>
                    <thead>
                        <tr>
                            <th style="width:5%;">No.</th>
                            <th style="width:35%;">Question</th>
                            <th style="width:25%;">Student Answer</th>
                            <th style="width:25%;">Correct Answer</th>
                            <th style="width:10%;">Note</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${tableRows}
                    </tbody>
                </table>

                <div style="margin-top: 60px; text-align: right;">
                    <p>Checked by,</p>
                    <p><strong>Deni</strong></p>
                </div>
            </body>
            </html>`;
            
            printWindow.document.write(html);
            printWindow.document.close();
        }

        // --- INIT ---
        window.onload = () => {
            loadState();
            renderApp();
        };
    </script>
</body>
</html>
