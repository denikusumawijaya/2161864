                    { type: 'exercise', question: 'Simplify: $\\frac{\\sqrt{98} - \\sqrt{8}}{\\sqrt{2}}$', options: ['$5$', '$6$', '$4$', '$3$'], correct: '$5$', explanation: 'Top: $7\\sqrt{2} - 2\\sqrt{2} = 5\\sqrt{2}$. Divide by $\\sqrt{2}$ gives 5.' },
                    { type: 'exercise', question: 'Perimeter of triangle with sides $\\sqrt{12}, \\sqrt{27}, \\sqrt{48}$.', options: ['$9\\sqrt{3}$', '$8\\sqrt{3}$', '$10\\sqrt{3}$', '$12\\sqrt{3}$'], correct: '$9\\sqrt{3}$', explanation: 'Sum all sides: $2+3+4=9$.' },
                    { type: 'exercise', question: 'Simplify: $2\\sqrt{5} \\times \\sqrt{20} + \\sqrt{45}$', options: ['$20 + 3\\sqrt{5}$', '$23\\sqrt{5}$', '$20 + 5\\sqrt{5}$', '$13\\sqrt{5}$'], correct: '$20 + 3\\sqrt{5}$', explanation: 'Multiply first: $\\sqrt{20} = 2\\sqrt{5}$. $2\\sqrt{5} \\times 2\\sqrt{5} = 4 \\times 5 = 20$. Then add $\\sqrt{45} = 3\\sqrt{5}$.' },
                    { type: 'exercise', question: 'Simplify: $3\\sqrt{8} \\times \\sqrt{18} - \\sqrt{50}$', options: ['$36 - 5\\sqrt{2}$', '$31\\sqrt{2}$', '$23\\sqrt{2}$', '$36 - 3\\sqrt{2}$'], correct: '$36 - 5\\sqrt{2}$', explanation: 'Multiply first: $3\\sqrt{8} = 6\\sqrt{2}$. $\\sqrt{18} = 3\\sqrt{2}$. $6\\sqrt{2} \\times 3\\sqrt{2} = 18 \\times 2 = 36$. Then subtract $\\sqrt{50} = 5\\sqrt{2}$.' },
                    { type: 'exercise', question: 'Simplify: $4\\sqrt{5} - 2\\sqrt{45} + \\sqrt{125}$', options: ['$3\\sqrt{5}$', '$5\\sqrt{5}$', '$4\\sqrt{5}$', '$6\\sqrt{5}$'], correct: '$3\\sqrt{5}$', explanation: '$4 - 6 + 5 = 3$.' }
                ]
            },
            {
                id: 'final',
                title: 'Consolidation',
                type: 'final',
                content: `
                    <h2 class="text-xl font-bold text-[#58cc02] mb-4">Excellent Work! | Kerja Bagus!</h2>
                    <p class="lang-en">You have mastered the "Architecture of Radicals" today. You learned how to simplify, match, and combine surds perfectly!</p>
                    <p class="lang-id">Kamu telah menguasai "Arsitektur Radikal" hari ini. Kamu belajar cara menyederhanakan, mencocokkan, dan menggabungkan surd dengan sempurna!</p>
                    <div class="bg-green-50 p-4 rounded-xl border-2 border-green-200 mt-4">
                        <h3 class="font-bold text-green-800 mb-2"><i class="fas fa-clipboard-check"></i> Summary | Ringkasan</h3>
                        <p class="lang-en">1. <b>Simplify</b> every radical first.</p>
                        <p class="lang-id">1. <b>Sederhanakan</b> semua akar terlebih dahulu.</p>
                        <p class="lang-en">2. <b>Match</b> the "like" surds (same root).</p>
                        <p class="lang-id">2. <b>Cocokkan</b> surd yang "sejenis" (akar sama).</p>
                        <p class="lang-en">3. <b>Combine</b> the outside numbers. Never touch the root when adding!</p>
                        <p class="lang-id">3. <b>Gabungkan</b> angka di luarnya. Jangan sentuh akarnya saat menjumlahkan!</p>
                    </div>
                    <p class="lang-en mt-4">To complete your homework and review today notes, please click the button below to go to your dashboard.</p>
                    <p class="lang-id mt-4">Untuk mengerjakan PR dan melihat catatan hari ini, silakan klik tombol di bawah untuk masuk ke dashboard kamu.</p>
                `
            }
        ];

        // State Management
        let currentSectionIndex = 0;
        let currentStepIndex = 0;
        let progress = {};

        function loadProgress() {
            const saved = localStorage.getItem('mathTutorProgress');
            if (saved) progress = JSON.parse(saved);
        }

        function saveProgress() {
            localStorage.setItem('mathTutorProgress', JSON.stringify(progress));
        }

        function resetAllProgress() {
            if (confirm("Are you sure you want to reset ALL progress? This cannot be undone. | Kamu yakin ingin mereset SEMUA progres? Ini tidak bisa dibatalkan.")) {
                localStorage.removeItem('mathTutorProgress');
                progress = {};
                currentSectionIndex = 0;
                currentStepIndex = 0;
                renderSidebar();
                renderContent();
                updateProgressBar();
            }
        }

        function renderSidebar() {
            const nav = document.getElementById('sidebar-nav');
            nav.innerHTML = '';
            lessonData.forEach((section, sIndex) => {
                let itemClass = 'sidebar-item';
                if (sIndex === currentSectionIndex) itemClass += ' active';
                let icon = 'fa-circle';
                if (section.type === 'static') icon = 'fa-home';
                else if (section.type === 'lesson') icon = 'fa-book-open';
                else if (section.type === 'assignment') icon = 'fa-pencil-alt';
                else if (section.type === 'final') icon = 'fa-flag-checkered';
                let isCompleted = false;
                if ((section.type === 'lesson' || section.type === 'assignment') && progress[section.id]) {
                    const totalSteps = section.steps.length;
                    const answeredSteps = Object.keys(progress[section.id]).length;
                    if (answeredSteps >= totalSteps) {
                        isCompleted = true;
                        icon = 'fa-check-circle';
                    }
                }
                nav.innerHTML += `<div class="${itemClass} ${isCompleted ? 'completed' : ''}" onclick="jumpToSection(${sIndex})"><i class="fas ${icon} mr-3" style="width: 20px;"></i><span>${section.title}</span></div>`;
            });
        }

        function jumpToSection(index) {
            currentSectionIndex = index;
            currentStepIndex = 0;
            renderSidebar();
            renderContent();
            updateProgressBar();
            document.getElementById('sidebar').classList.remove('open');
        }

        function renderContent() {
            const display = document.getElementById('content-display');
            const section = lessonData[currentSectionIndex];

            if (section.type === 'static' || section.type === 'final') {
                display.innerHTML = section.content;
                document.getElementById('action-buttons').style.display = 'flex';
                if (section.type === 'final') {
                    document.getElementById('action-buttons').innerHTML = `
                        <button class="btn btn-secondary" onclick="prevStep()"><i class="fas fa-chevron-left"></i> Prev</button>
                        <a href="https://learn.algonova.id/login" target="_blank" class="btn btn-primary">Go to Homework <i class="fas fa-external-link-alt"></i></a>`;
                } else {
                     document.getElementById('action-buttons').innerHTML = `
                        <button class="btn btn-secondary" style="visibility: hidden;"></button>
                        <button class="btn btn-primary" onclick="nextStep()">Start Lesson <i class="fas fa-chevron-right"></i></button>`;
                }
            } else if (section.type === 'assignment' && section.steps.every(s => s.type === 'exercise')) {
                let html = `<h3 class="text-sm font-bold uppercase text-gray-400 tracking-wide mb-2">${section.title}</h3>`;
                const step = section.steps[currentStepIndex];
                const stepProgress = progress[section.id]?.[currentStepIndex];
                const qParts = step.question.split('|');
                const qEn = qParts[0].trim();
                const qId = qParts[1] ? qParts[1].trim() : '';
                const optionsHtml = shuffleOptions(step.options, step.correct, step.explanation, `${section.id}-${currentStepIndex}`);
                html += `
                    <h3 class="text-sm font-bold uppercase text-gray-400 tracking-wide mb-2">Exercise ${currentStepIndex + 1} of ${section.steps.length}</h3>
                    <div class="bg-gray-50 p-5 rounded-xl border border-gray-200">
                        <p class="lang-en text-lg font-bold mb-1">${qEn}</p>
                        ${qId ? `<p class="lang-id text-sm italic text-gray-500 mb-3">${qId}</p>` : ''}
                        <div class="mt-4" id="options-container-${section.id}-${currentStepIndex}">${optionsHtml}</div>
                        <div class="accordion ${stepProgress ? 'active' : ''}" id="accordion-${section.id}-${currentStepIndex}">
                            <div class="accordion-header" onclick="toggleAccordion('${section.id}-${currentStepIndex}')">
                                <span>Explanation | Penjelasan</span>
                                <i class="fas fa-chevron-down"></i>
                            </div>
                            <div class="accordion-body" id="accordion-body-${section.id}-${currentStepIndex}">
                                ${stepProgress ? step.explanation : 'Answer the question first to see the explanation. | Jawab pertanyaan dulu untuk melihat penjelasan.'}
                            </div>
                        </div>
                    </div>`;
                
                if (currentStepIndex === section.steps.length - 1) {
                    let allAnswered = true;
                    for(let i=0; i<section.steps.length; i++) {
                        if (!progress[section.id]?.[i]) { allAnswered = false; break; }
                    }
                    html += `<div class="mt-6 text-center bg-blue-50 p-4 rounded-xl border border-blue-200">
                        <button class="btn btn-primary" onclick="printAssignment('${section.id}')"><i class="fas fa-print"></i> Print Result</button>
                    </div>`;
                }

                display.innerHTML = html;
                document.getElementById('action-buttons').style.display = 'flex';
                let nextBtnLabel = (currentStepIndex === section.steps.length - 1) ? "Next Assignment" : "Next";
                document.getElementById('action-buttons').innerHTML = `
                    <button class="btn btn-secondary" onclick="prevStep()"><i class="fas fa-chevron-left"></i> Prev</button>
                    <button class="btn btn-primary" onclick="nextStep()">${nextBtnLabel} <i class="fas fa-chevron-right"></i></button>`;
            } else {
                const step = section.steps[currentStepIndex];
                let html = `<h3 class="text-sm font-bold uppercase text-gray-400 tracking-wide mb-2">${section.title}</h3>`;
                if (step.type === 'theory') {
                    html += step.content;
                } else if (step.type === 'exercise') {
                    const stepProgress = progress[section.id]?.[currentStepIndex];
                    const qParts = step.question.split('|');
                    const qEn = qParts[0].trim();
                    const qId = qParts[1] ? qParts[1].trim() : '';
                    const optionsHtml = shuffleOptions(step.options, step.correct, step.explanation, `${section.id}-${currentStepIndex}`);
                    html += `
                        <h3 class="text-sm font-bold uppercase text-gray-400 tracking-wide mb-2">Exercise ${currentStepIndex + 1} of ${section.steps.length}</h3>
                        <div class="bg-gray-50 p-5 rounded-xl border border-gray-200">
                            <p class="lang-en text-lg font-bold mb-1">${qEn}</p>
                            ${qId ? `<p class="lang-id text-sm italic text-gray-500 mb-3">${qId}</p>` : ''}
                            <div class="mt-4" id="options-container-${section.id}-${currentStepIndex}">${optionsHtml}</div>
                            <div class="accordion ${stepProgress ? 'active' : ''}" id="accordion-${section.id}-${currentStepIndex}">
                                <div class="accordion-header" onclick="toggleAccordion('${section.id}-${currentStepIndex}')">
                                    <span>Explanation | Penjelasan</span>
                                    <i class="fas fa-chevron-down"></i>
                                </div>
                                <div class="accordion-body" id="accordion-body-${section.id}-${currentStepIndex}">
                                    ${stepProgress ? step.explanation : 'Answer the question first to see the explanation. | Jawab pertanyaan dulu untuk melihat penjelasan.'}
                                </div>
                            </div>
                        </div>`;
                }
                display.innerHTML = html;
                document.getElementById('action-buttons').style.display = 'flex';
                document.getElementById('action-buttons').innerHTML = `
                    <button class="btn btn-secondary" onclick="prevStep()"><i class="fas fa-chevron-left"></i> Prev</button>
                    <button class="btn btn-primary" onclick="nextStep()">Next <i class="fas fa-chevron-right"></i></button>`;
            }
            
            if (typeof renderMathInElement !== 'undefined') {
                renderMathInElement(display, {
                    delimiters: [{left: "$$", right: "$$", display: true},{left: "$", right: "$", display: false}]
                });
            }
        }

        function shuffleOptions(options, correct, explanation, stepId) {
            if (progress[lessonData[currentSectionIndex].id]?.[currentStepIndex]) {
                const sp = progress[lessonData[currentSectionIndex].id][currentStepIndex];
                let html = '';
                sp.shuffledOptions.forEach(opt => {
                    let cls = 'option-btn';
                    if (opt === sp.selected) { cls += sp.correct ? ' correct' : ' incorrect'; } 
                    else if (opt === correct && !sp.correct) { cls += ' correct'; }
                    html += `<button class="${cls}" disabled><i class="fas ${opt === correct ? 'fa-check' : 'fa-times'}"></i> ${opt}</button>`;
                });
                html += `<button class="btn btn-outline mt-3 text-sm py-2" onclick="resetStep('${stepId}')"><i class="fas fa-redo-alt mr-2"></i> Reset Answer | Reset Jawaban</button>`;
                return html;
            }
            const shuffled = [...options].sort(() => Math.random() - 0.5);
            let html = '';
            shuffled.forEach(opt => {
                html += `<button class="option-btn" onclick="selectOption('${stepId}', '${opt.replace(/\\/g, '\\\\').replace(/'/g, "\\'")}')"><i class="fas fa-circle text-gray-300"></i> ${opt}</button>`;
            });
            window[`shuffled_${stepId}`] = shuffled;
            return html;
        }

        function selectOption(stepId, selectedOption) {
            const [sectionId, stepIdx] = stepId.split('-');
            const stepIdxNum = parseInt(stepIdx);
            const section = lessonData.find(s => s.id === sectionId);
            const step = section.steps[stepIdxNum];
            const isCorrect = selectedOption === step.correct;
            if (!progress[sectionId]) progress[sectionId] = {};
            progress[sectionId][stepIdxNum] = { answered: true, correct: isCorrect, selected: selectedOption, shuffledOptions: window[`shuffled_${stepId}`] };
            saveProgress();
            renderContent();
            setTimeout(() => { toggleAccordion(stepId, true); }, 100);
            updateProgressBar();
        }

        function resetStep(stepId) {
            const [sectionId, stepIdx] = stepId.split('-');
            const stepIdxNum = parseInt(stepIdx);
            if (progress[sectionId] && progress[sectionId][stepIdxNum]) {
                delete progress[sectionId][stepIdxNum];
                saveProgress();
                renderContent();
                updateProgressBar();
            }
        }

        function toggleAccordion(stepId, forceOpen) {
            const acc = document.getElementById(`accordion-${stepId}`);
            if (acc) {
                if (forceOpen) { acc.classList.add('active'); } else { acc.classList.toggle('active'); }
                const [sectionId, stepIdx] = stepId.split('-');
                const step = lessonData.find(s => s.id === sectionId).steps[parseInt(stepIdx)];
                document.getElementById(`accordion-body-${stepId}`).innerHTML = step.explanation;
                if (typeof renderMathInElement !== 'undefined') {
                    renderMathInElement(document.getElementById(`accordion-body-${stepId}`), {
                        delimiters: [{left: "$$", right: "$$", display: true}, {left: "$", right: "$", display: false}]
                    });
                }
            }
        }

        function nextStep() {
            const section = lessonData[currentSectionIndex];
            if ((section.type === 'lesson' || section.type === 'assignment') && currentStepIndex < section.steps.length - 1) {
                currentStepIndex++;
            } else if (currentSectionIndex < lessonData.length - 1) {
                currentSectionIndex++;
                currentStepIndex = 0;
            }
            renderSidebar();
            renderContent();
            updateProgressBar();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function prevStep() {
            if (currentStepIndex > 0) {
                currentStepIndex--;
            } else if (currentSectionIndex > 0) {
                currentSectionIndex--;
                const prevSection = lessonData[currentSectionIndex];
                if (prevSection.type === 'lesson' || prevSection.type === 'assignment') {
                    currentStepIndex = prevSection.steps.length - 1;
                } else { currentStepIndex = 0; }
            }
            renderSidebar();
            renderContent();
            updateProgressBar();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateProgressBar() {
            let totalSteps = 0;
            let completedSteps = 0;
            lessonData.forEach(sec => {
                if (sec.type === 'lesson' || sec.type === 'assignment') {
                    totalSteps += sec.steps.length;
                    if (progress[sec.id]) { completedSteps += Object.keys(progress[sec.id]).length; }
                }
            });
            const percent = totalSteps > 0 ? (completedSteps / totalSteps) * 100 : 0;
            document.getElementById('progress-fill').style.width = percent + '%';
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

        function printAssignment(sectionId) {
            const section = lessonData.find(s => s.id === sectionId);
            if (!section) return;
            let score = 0;
            let tableRows = '';
            section.steps.forEach((step, index) => {
                const sp = progress[sectionId]?.[index];
                const studentAns = sp ? sp.selected : '-';
                const correctAns = step.correct;
                const note = sp ? (sp.correct ? '<span style="color:green; font-weight:bold;">&#10004;</span>' : '<span style="color:red; font-weight:bold;">&#10008;</span>') : '-';
                if (sp && sp.correct) score++;
                
                const qParts = step.question.split('|');
                const qEn = qParts[0] ? qParts[0].trim() : '';
                const qId = qParts[1] ? qParts[1].trim() : '';
                const questionHtml = qEn + (qId ? `<br><i style="font-size:9px; color:#555;">${qId}</i>` : '');

                tableRows += `<tr><td style="text-align: center; vertical-align: top;">${index + 1}</td><td style="vertical-align: top;">${questionHtml}</td><td style="vertical-align: top;">${studentAns}</td><td style="vertical-align: top;">${correctAns}</td><td style="text-align: center; vertical-align: top;">${note}</td></tr>`;
            });

            const printHtml = `
                <!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Print Result - ${section.title}</title>
                <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
                <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"><\/script>
                <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"><\/script>
                <style>@page { size: A4; margin: 10mm; } body { font-family: Arial, sans-serif; font-size: 11px; } h1, h2, h3 { margin: 0; padding: 0; } .header { text-align: center; margin-bottom: 15px; border-bottom: 2px solid #000; padding-bottom: 5px; } .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 10px; } .info-item { font-size: 11px; } table { width: 100%; border-collapse: collapse; margin-top: 5px; table-layout: fixed; } th, td { border: 1px solid #000; padding: 4px; font-size: 10px; word-wrap: break-word; } th { background: #f0f0f0; text-align: center; } .footer { margin-top: 30px; text-align: right; } @media print { body { -webkit-print-color-adjust: exact; } }</style>
                </head><body>
                    <div class="header"><h2>MATH TUTORING by Deni</h2></div>
                    <div class="info-grid">
                        <div class="info-item"><b>Name:</b> .....................................</div>
                        <div class="info-item"><b>Date:</b> .....................................</div>
                        <div class="info-item"><b>Topic:</b> Operations with Surds (Addition & Subtraction)</div>
                        <div class="info-item"><b>Assignment Group:</b> ${section.title}</div>
                        <div class="info-item"><b>Score:</b> ${score} / 10</div>
                    </div>
                    <table><thead><tr><th style="width: 5%;">No.</th><th style="width: 35%;">Question</th><th style="width: 20%;">Student Answer</th><th style="width: 20%;">Correct Answer</th><th style="width: 10%;">Note</th></tr></thead><tbody>${tableRows}</tbody></table>
                    <div class="footer"><p>Checked by,</p><br><br><p><b>Deni</b></p></div>
                    <script>window.onload = function() { if (typeof renderMathInElement !== 'undefined') { renderMathInElement(document.body, { delimiters: [{left: "$$", right: "$$", display: true}, {left: "$", right: "$", display: false}], throwOnError: false }); } setTimeout(function() { window.print(); }, 500); };<\/script>
                </body></html>`;
            const printWindow = window.open('', '_blank');
            printWindow.document.write(printHtml);
            printWindow.document.close();
        }

        document.addEventListener("DOMContentLoaded", function() {
            loadProgress();
            renderSidebar();
            renderContent();
            updateProgressBar();
        });
</script>
</body>
</html>
