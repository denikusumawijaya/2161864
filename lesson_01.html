<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Place Value & Large Numbers in Business</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" onload="window.katexReady=true;"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1117;--bg2:#151b25;--card:#1a2332;--card2:#1f2b3d;
  --fg:#e2e8f0;--fg2:#cbd5e1;--muted:#64748b;
  --accent:#f59e0b;--accent2:#d97706;--teal:#14b8a6;--teal2:#0d9488;
  --err:#ef4444;--ok:#22c55e;--border:#2a3a4a;--border2:#334155;
  --sidebar-w:280px;--radius:12px;--radius2:8px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--fg);height:100vh;display:flex;overflow:hidden}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;font-weight:600}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
#sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);height:100vh;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;position:relative;z-index:100;transition:transform .3s}
.sidebar-header{padding:20px 16px 12px;border-bottom:1px solid var(--border)}
.sidebar-header h1{font-size:14px;color:var(--accent);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:2px}
.sidebar-header .topic{font-size:11px;color:var(--muted);line-height:1.4}
.sidebar-header .topic b{color:var(--fg2);display:block;margin-top:4px;font-size:12px}
.sidebar-nav{flex:1;padding:8px 0;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;transition:all .2s;border-left:3px solid transparent;position:relative}
.nav-item:hover{background:rgba(245,158,11,.06)}
.nav-item.active{background:rgba(245,158,11,.1);border-left-color:var(--accent)}
.nav-item .nav-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;background:var(--card);color:var(--muted);flex-shrink:0;transition:all .2s}
.nav-item.active .nav-icon{background:var(--accent);color:var(--bg)}
.nav-item.completed .nav-icon{background:var(--teal);color:#fff}
.nav-item .nav-text{flex:1;min-width:0}
.nav-item .nav-title{font-size:12.5px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.nav-item.active .nav-title{color:var(--fg);font-weight:600}
.nav-item .nav-time{font-size:10px;color:var(--muted);margin-top:1px}
.nav-item .nav-prog{position:absolute;bottom:2px;left:16px;right:16px;height:2px;background:var(--border);border-radius:1px}
.nav-item .nav-prog-fill{height:100%;background:var(--teal);border-radius:1px;transition:width .4s}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border)}
.btn-reset-all{width:100%;padding:8px;border:1px solid var(--err);background:transparent;color:var(--err);border-radius:var(--radius2);cursor:pointer;font-size:11px;font-family:inherit;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-reset-all:hover{background:var(--err);color:#fff}
#main-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
#topbar{height:52px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:16px;flex-shrink:0}
#topbar .burger{display:none;background:none;border:none;color:var(--fg);font-size:18px;cursor:pointer}
.topbar-title{font-family:'Space Grotesk',sans-serif;font-size:15px;color:var(--fg);font-weight:600}
.topbar-progress{flex:1;max-width:300px;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.topbar-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--teal));border-radius:3px;transition:width .5s}
.topbar-pct{font-size:12px;color:var(--muted);font-weight:500}
#main-content{flex:1;overflow-y:auto;padding:32px 40px 80px;min-height:0}
.content-section{max-width:820px;margin:0 auto}
.section-header{margin-bottom:32px;animation:fadeUp .5s ease}
.section-header .sec-icon{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;margin-bottom:16px}
.section-header h2{font-size:28px;color:var(--fg);margin-bottom:4px}
.section-header .sec-time{font-size:13px;color:var(--accent);font-weight:500}
.theory-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:24px;animation:fadeUp .5s ease;position:relative;overflow:hidden}
.theory-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--teal))}
.theory-card .th-icon{float:right;width:40px;height:40px;border-radius:8px;background:rgba(245,158,11,.12);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:16px;margin-left:16px;margin-bottom:8px}
.theory-card h3{font-size:17px;color:var(--fg);margin-bottom:8px}
.theory-card .th-id{font-size:11px;color:var(--muted);font-style:italic;margin-bottom:8px;margin-top:-4px}
.theory-card .th-body{font-size:14px;line-height:1.75;color:var(--fg2)}
.theory-card .th-body-id{font-size:11.5px;line-height:1.6;color:var(--muted);margin-top:6px;padding-top:6px;border-top:1px dashed var(--border)}
.theory-card .th-body p{margin-bottom:8px}
.theory-card .th-body ul{margin:8px 0 8px 20px}
.theory-card .th-body li{margin-bottom:4px}
.exercise-card{background:var(--card2);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px;animation:fadeUp .5s ease}
.exercise-card.correct{border-color:var(--ok)}
.exercise-card.incorrect{border-color:var(--err)}
.ex-card-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ex-num{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.ex-label{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.ex-question{font-size:15px;line-height:1.7;color:var(--fg);margin-bottom:6px}
.ex-question-id{font-size:11.5px;line-height:1.5;color:var(--muted);margin-bottom:14px}
.ex-options{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.ex-opt{padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius2);cursor:pointer;font-size:13.5px;color:var(--fg2);transition:all .2s;display:flex;align-items:center;gap:10px}
.ex-opt:hover{border-color:var(--accent);background:rgba(245,158,11,.05)}
.ex-opt.selected{border-color:var(--accent);background:rgba(245,158,11,.1);color:var(--fg)}
.ex-opt.correct-answer{border-color:var(--ok);background:rgba(34,197,94,.1);color:var(--ok)}
.ex-opt.wrong-answer{border-color:var(--err);background:rgba(239,68,68,.1);color:var(--err)}
.ex-opt .opt-letter{width:22px;height:22px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;transition:all .2s}
.ex-opt.selected .opt-letter{background:var(--accent);color:var(--bg)}
.ex-opt.correct-answer .opt-letter{background:var(--ok);color:#fff}
.ex-opt.wrong-answer .opt-letter{background:var(--err);color:#fff}
.ex-fill-wrap{margin-bottom:16px}
.ex-fill{width:100%;max-width:320px;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius2);color:var(--fg);font-size:14px;font-family:inherit;transition:border-color .2s}
.ex-fill:focus{outline:none;border-color:var(--accent)}
.ex-fill.correct{border-color:var(--ok)}
.ex-fill.wrong{border-color:var(--err)}
.ex-tf-wrap{display:flex;gap:10px;margin-bottom:16px}
.ex-tf-btn{padding:10px 24px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius2);cursor:pointer;font-size:13px;color:var(--fg2);font-family:inherit;transition:all .2s;font-weight:500}
.ex-tf-btn:hover{border-color:var(--accent)}
.ex-tf-btn.selected{border-color:var(--accent);background:rgba(245,158,11,.1);color:var(--fg)}
.ex-tf-btn.correct-answer{border-color:var(--ok);background:rgba(34,197,94,.1);color:var(--ok)}
.ex-tf-btn.wrong-answer{border-color:var(--err);background:rgba(239,68,68,.1);color:var(--err)}
.ex-check-wrap{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.btn-check{padding:10px 28px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:var(--radius2);cursor:pointer;font-size:13px;font-family:inherit;font-weight:600;transition:all .2s;box-shadow:0 2px 8px rgba(245,158,11,.25)}
.btn-check:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(245,158,11,.35)}
.btn-check:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.ex-result{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;opacity:0}
.ex-result.show{opacity:1}
.ex-result.correct{color:var(--ok)}
.ex-result.incorrect{color:var(--err)}
.ex-explanation{margin-top:12px;overflow:hidden;max-height:0;opacity:0}
.ex-explanation.open{max-height:500px;opacity:1}
.ex-explanation-inner{background:rgba(20,184,166,.08);border:1px solid rgba(20,184,166,.2);border-radius:var(--radius2);padding:14px 16px;font-size:13px;line-height:1.7;color:var(--teal)}
.ex-explanation-inner .exp-id{font-size:11px;color:var(--muted);margin-top:6px;font-style:italic}
.nav-buttons{display:flex;justify-content:space-between;align-items:center;padding:20px 0;margin-top:12px;border-top:1px solid var(--border)}
.btn-nav{padding:10px 20px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius2);cursor:pointer;font-size:12px;font-family:inherit;color:var(--fg2);font-weight:500;transition:all .2s;display:flex;align-items:center;gap:6px}
.btn-nav:hover{border-color:var(--accent);color:var(--fg)}
.btn-nav:disabled{opacity:.3;cursor:not-allowed}
.home-section{text-align:center;animation:fadeUp .6s ease}
.home-logo{width:80px;height:80px;border-radius:20px;background:linear-gradient(135deg,var(--accent),var(--teal));display:flex;align-items:center;justify-content:center;font-size:36px;color:#fff;margin:0 auto 24px;box-shadow:0 8px 32px rgba(245,158,11,.2)}
.home-section h2{font-size:32px;margin-bottom:4px;background:linear-gradient(135deg,var(--accent),var(--teal));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.home-section .home-sub{font-size:14px;color:var(--muted);margin-bottom:24px}
.home-section .home-topic{font-size:18px;color:var(--fg);font-weight:600;margin-bottom:4px}
.home-section .home-topic-id{font-size:12px;color:var(--muted);margin-bottom:32px}
.home-rules{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;text-align:left;max-width:480px;margin:0 auto 32px}
.home-rules h4{font-size:14px;color:var(--accent);margin-bottom:12px}
.home-rules li{font-size:13px;color:var(--fg2);margin-bottom:8px;line-height:1.6}
.home-rules li i{color:var(--teal);margin-right:6px;width:16px;text-align:center}
.btn-start{padding:14px 48px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:var(--radius);cursor:pointer;font-size:15px;font-family:inherit;font-weight:700;transition:all .3s;box-shadow:0 4px 16px rgba(245,158,11,.3)}
.btn-start:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(245,158,11,.4)}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:var(--radius2);font-size:13px;font-weight:500;z-index:9999;animation:fadeUp .3s ease;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.toast.success{background:var(--ok);color:#fff}
.toast.error{background:var(--err);color:#fff}
.illust-svg{text-align:center;margin:16px 0}
.illust-svg svg{max-width:100%;height:auto}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s ease}
@media(max-width:768px){
  #sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);z-index:200}
  #sidebar.open{transform:translateX(0)}
  #topbar .burger{display:block}
  #main-content{padding:20px 16px 80px}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150}
  .sidebar-overlay.show{display:block}
}
.katex{font-size:1em!important}
.exercise-card .katex{font-size:1.05em!important}

.btn-ex-reset{
  padding:8px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius2);
  cursor:pointer;font-size:12px;font-family:inherit;color:var(--fg2);font-weight:500;
  transition:all .2s;display:inline-flex;align-items:center;gap:5px;
}
.btn-ex-reset:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<nav id="sidebar"></nav>
<div id="main-wrap">
<div id="topbar">
<button class="burger" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
<span class="topbar-title" id="topbarTitle">Place Value & Large Numbers</span>
<div class="topbar-progress"><div class="topbar-progress-fill" id="topbarProgFill"></div></div>
<span class="topbar-pct" id="topbarPct">0%</span>
</div>
<div id="main-content"></div>
</div>
<script>
// ===================== SECTION DATA =====================
const SECTIONS = [
  {
    id:'home', title:'Home', icon:'fa-house', type:'home'
  },
  {
    id:'spiral', title:'Spiral Review Warm-up', time:'00:00–00:10', icon:'fa-rotate', type:'lesson',
    content:[
      {type:'theory', icon:'fa-percent', title:'Quick Percentage Calculations in Business', titleId:'Perhitungan Persentase Cepat dalam Bisnis',
        body:'<p>In business, percentages appear everywhere: profit margins, discounts, tax rates, and investment returns. Being able to calculate them quickly is an essential skill for any CEO.</p><p>The key formula: \\(\\text{Percentage} = \\frac{\\text{Rate}}{100} \\times \\text{Base}\\)</p><p>For example, 15% of 200,000 = \\(\\frac{15}{100} \\times 200{,}000 = 0.15 \\times 200{,}000 = 30{,}000\\).</p>',
        bodyId:'<p>Di bisnis, persentase ada di mana-mana: margin keuntungan, diskon, tarif pajak, dan pengembalian investasi. Mampu menghitungnya dengan cepat adalah keterampilan penting bagi setiap CEO.</p><p>Rumus kunci: Persentase = (Tarif / 100) × Dasar</p>'},
      {type:'ex', qType:'mc', q:'What is 15% of $200,000?', qId:'Berapa 15% dari $200.000?',
        opts:['$30,000','$3,000','$300,000','$15,000'], ans:0,
        exp:'Using the formula: 0.15 × 200,000 = 30,000. Move the decimal two places left (divide by 100), then multiply by 15.',
        expId:'Menggunakan rumus: 0,15 × 200.000 = 30.000. Pindahkan koma dua tempat ke kiri (bagi 100), lalu kalikan 15.'},
      {type:'ex', qType:'mc', q:'A store offers a 25% discount on an $80,000 product. How much is the discount?', qId:'Sebuah toko memberikan diskon 25% untuk produk $80.000. Berapa besar diskonnya?',
        opts:['$20,000','$2,000','$8,000','$25,000'], ans:0,
        exp:'25% of 80,000 = 0.25 × 80,000 = 20,000. Remember: 25% = 1/4, so you can also divide 80,000 by 4.',
        expId:'25% dari 80.000 = 0,25 × 80.000 = 20.000. Ingat: 25% = 1/4, jadi Anda juga bisa membagi 80.000 dengan 4.'},
      {type:'ex', qType:'fill', q:'A company\'s revenue is $500,000. If 12% is profit, the profit amount is $____.', qId:'Pendapatan perusahaan $500.000. Jika 12% adalah keuntungan, jumlah keuntungannya adalah $____.',
        ans:'60000',
        exp:'12% of 500,000 = 0.12 × 500,000 = 60,000. Tip: 10% = 50,000 and 2% = 10,000, so 12% = 60,000.',
        expId:'12% dari 500.000 = 0,12 × 500.000 = 60.000. Tip: 10% = 50.000 dan 2% = 10.000, jadi 12% = 60.000.'},

      {type:'theory', icon:'fa-cart-shopping', title:'Multiplication for Total Costs', titleId:'Perkalian untuk Total Biaya',
        body:'<p>When ordering supplies or calculating total revenue, multiplication is key. The fundamental formula:</p><p>\\(\\text{Total Cost} = \\text{Unit Price} \\times \\text{Quantity}\\)</p><p>For instance, 3 units at $45,000 each = \\(3 \\times 45{,}000 = 135{,}000\\).</p>',
        bodyId:'<p>Saat memesan perlengkapan atau menghitung total pendapatan, perkalian adalah kunci. Rumus dasar: Total Biaya = Harga Satuan × Jumlah</p>'},
      {type:'ex', qType:'mc', q:'If a product costs $45,000 per unit and you buy 3 units, what is the total?', qId:'Jika produk berharga $45.000 per unit dan Anda membeli 3 unit, berapa totalnya?',
        opts:['$135,000','$145,000','$125,000','$90,000'], ans:0,
        exp:'45,000 × 3 = 135,000. Break it down: 40,000 × 3 = 120,000 and 5,000 × 3 = 15,000. Total = 135,000.',
        expId:'45.000 × 3 = 135.000. Uraian: 40.000 × 3 = 120.000 dan 5.000 × 3 = 15.000. Total = 135.000.'},
      {type:'ex', qType:'fill', q:'A company orders 12 laptops at $8,500 each. The total cost is $____.', qId:'Perusahaan memesan 12 laptop masing-masing $8.500. Total biayanya adalah $____.',
        ans:'102000',
        exp:'8,500 × 12 = 8,500 × 10 + 8,500 × 2 = 85,000 + 17,000 = 102,000.',
        expId:'8.500 × 12 = 8.500 × 10 + 8.500 × 2 = 85.000 + 17.000 = 102.000.'},
      {type:'ex', qType:'mc', q:'Which expression correctly calculates the total for 5 items at $23,000 each?', qId:'Ekspresi mana yang benar menghitung total 5 item masing-masing $23.000?',
        opts:['\\(5 \\times 23{,}000\\)','\\(5 + 23{,}000\\)','\\(23{,}000 \\div 5\\)','\\(23{,}000 - 5\\)'], ans:0,
        exp:'Total = quantity × unit price = 5 × 23,000 = 115,000. Addition, division, and subtraction do not give the correct total cost.',
        expId:'Total = jumlah × harga satuan = 5 × 23.000 = 115.000. Penjumlahan, pembagian, dan pengurangan tidak memberikan total biaya yang benar.'},

      {type:'theory', icon:'fa-piggy-bank', title:'Simple Equations & Savings in Business', titleId:'Persamaan Sederhana & Tabungan dalam Bisnis',
        body:'<p>Business planning often involves solving equations and projecting savings over time.</p><p>For example, to solve \\(2x + 500 = 1{,}500\\):</p><ul><li>Subtract 500 from both sides: \\(2x = 1{,}000\\)</li><li>Divide by 2: \\(x = 500\\)</li></ul><p>For savings: \\(\\text{Total Savings} = \\text{Daily Amount} \\times \\text{Number of Days}\\)</p>',
        bodyId:'<p>Perencanaan bisnis sering melibatkan penyelesaian persamaan dan proyeksi tabungan dari waktu ke waktu.</p>'},
      {type:'ex', qType:'fill', q:'Solve for \\(x\\): \\(2x + 500 = 1{,}500\\). \\(x =\\) ____', qId:'Selesaikan untuk x: 2x + 500 = 1.500. x = ____',
        ans:'500',
        exp:'Step 1: 2x + 500 = 1,500 → 2x = 1,000 (subtract 500). Step 2: x = 500 (divide by 2).',
        expId:'Langkah 1: 2x + 500 = 1.500 → 2x = 1.000 (kurangi 500). Langkah 2: x = 500 (bagi 2).'},
      {type:'ex', qType:'fill', q:'If you save $1,500 every day for 7 days, your total savings = $____.', qId:'Jika Anda menabung $1.500 setiap hari selama 7 hari, total tabungan = $____.',
        ans:'10500',
        exp:'1,500 × 7 = 10,500. Multiply: 1,000 × 7 = 7,000 and 500 × 7 = 3,500. Total = 10,500.',
        expId:'1.500 × 7 = 10.500. Perkalian: 1.000 × 7 = 7.000 dan 500 × 7 = 3.500. Total = 10.500.'},
      {type:'ex', qType:'mc', q:'A company saves $5,000 per month. How much do they save in one year?', qId:'Perusahaan menabung $5.000 per bulan. Berapa tabungan mereka dalam setahun?',
        opts:['$60,000','$50,000','$55,000','$65,000'], ans:0,
        exp:'5,000 × 12 = 60,000. There are 12 months in a year, so multiply the monthly savings by 12.',
        expId:'5.000 × 12 = 60.000. Ada 12 bulan dalam setahun, jadi kalikan tabungan bulanan dengan 12.'},
      {type:'ex', qType:'mc', q:'If \\(3x = 90{,}000\\), what is \\(x\\)?', qId:'Jika 3x = 90.000, berapa nilai x?',
        opts:['30,000','27,000','33,000','9,000'], ans:0,
        exp:'Divide both sides by 3: x = 90,000 ÷ 3 = 30,000.',
        expId:'Bagi kedua ruas dengan 3: x = 90.000 ÷ 3 = 30.000.'}
    ]

        body:'<p>Each digit in a number has a specific place and value:</p><ul><li><strong>Ones</strong> (1), <strong>Tens</strong> (10), <strong>Hundreds</strong> (100)</li><li><strong>Thousands</strong> (1,000), <strong>Ten Thousands</strong> (10,000), <strong>Hundred Thousands</strong> (100,000)</li></ul><p>Example: In \\(543{,}210\\), the 4 is in the <strong>ten thousands</strong> place, so its value is \\(4 \\times 10{,}000 = 40{,}000\\).</p>',
        bodyId:'<p>Setiap digit dalam angka memiliki tempat dan nilai tertentu: Satuan (1), Puluhan (10), Ratusan (100), Ribuan (1.000), Puluh Ribu (10.000), Ratus Ribu (100.000).</p>',

      {type:'theory', icon:'fa-arrows-left-right', title:'The Base-10 Relationship', titleId:'Hubungan Basis-10',

        bodyId:'<p>Sistem bilangan kita adalah basis-10: setiap nilai tempat adalah 10 kali tempat di sebelah kanannya. Ini disebut aturan Pangkat 10. Memindahkan digit satu tempat ke kiri mengalikan nilainya dengan 10.</p>'},

      {type:'theory', icon:'fa-arrow-right-arrow-left', title:'Moving Digits and Value Changes', titleId:'Memindahkan Digit dan Perubahan Nilai',
        body:'<p>Understanding how digit position affects value is key to reading large numbers correctly.</p><p>Rules:</p><ul><li>Move <strong>left</strong> 1 place → value becomes \\(10\\times\\) larger</li><li>Move <strong>right</strong> 1 place → value becomes \\(\\frac{1}{10}\\) as large</li><li>Move <strong>left</strong> 2 places → value becomes \\(100\\times\\) larger</li></ul>',

function loadState(){
  try{
    const s = localStorage.getItem('pvln_state');
    if(s) state = JSON.parse(s);
  }catch(e){}
}
function saveState(){
  try{ localStorage.setItem('pvln_state', JSON.stringify(state)); }catch(e){}
}
function resetAllState(){
  if(!confirm('Reset all progress? This cannot be undone.')) return;
  state = { currentSection:'home', answers:{}, progress:{} };
  saveState();
  renderSidebar();
  navigateTo('home');
  showToast('All progress reset','error');
}

// ===================== UTILS =====================
function shuffleArray(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function normalizeAnswer(s){
  return String(s).replace(/[,\s\$]/g,'').toLowerCase().trim();
}
function showToast(msg, type='success'){
  const t=document.createElement('div');
  t.className='toast '+type;
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2500);
}
function renderMath(el){
  if(typeof renderMathInElement==='function'){
    renderMathInElement(el,{
      delimiters:[
        {left:'\\[',right:'\\]',display:true},
        {left:'\\(',right:'\\)',display:false}
      ],
      throwOnError:false
    });
  }
}

// ===================== PROGRESS HELPERS =====================
function getSectionExCount(sec){
  if(!sec.content) return 0;
  return sec.content.filter(c=>c.type==='ex').length;
}
function getSectionAnswered(secId){
  const sec = SECTIONS.find(s=>s.id===secId);
  if(!sec || !sec.content) return 0;   // ← tambahkan cek content
  let count=0;
  sec.content.forEach((c,i)=>{
    const key=secId+'_'+i;
    if(state.answers[key]!==undefined) count++;
  });
  return count;
}
function getTotalExCount(){
  return SECTIONS.filter(s=>s.type==='lesson'||s.type==='assignment').reduce((sum,s)=>sum+getSectionExCount(s),0);
}
function getTotalAnswered(){
  return SECTIONS.filter(s=>s.type==='lesson'||s.type==='assignment').reduce((sum,s)=>sum+getSectionAnswered(s.id),0);
}
function isSectionComplete(secId){
  const sec = SECTIONS.find(s=>s.id===secId);
  return sec && getSectionAnswered(secId)===getSectionExCount(sec) && getSectionExCount(sec)>0;
}

// ===================== RENDER SIDEBAR =====================
function renderSidebar(){
  const nav = document.querySelector('.sidebar-nav') || document.createElement('div');
  nav.className='sidebar-nav';
  nav.innerHTML='';
  SECTIONS.forEach(sec=>{
    const item = document.createElement('div');
    item.className='nav-item'+(state.currentSection===sec.id?' active':'')+(isSectionComplete(sec.id)?' completed':'');
    item.onclick=()=>navigateTo(sec.id);
    const exCount = getSectionExCount(sec);
    const answered = getSectionAnswered(sec.id);
    const pct = exCount>0?Math.round(answered/exCount*100):0;
    item.innerHTML=`
      <div class="nav-icon"><i class="fas ${sec.icon}"></i></div>
      <div class="nav-text">
        <div class="nav-title">${sec.title}</div>
        ${sec.time?'<div class="nav-time">'+sec.time+'</div>':''}
      </div>
      ${exCount>0?'<div class="nav-prog"><div class="nav-prog-fill" style="width:'+pct+'%"></div></div>':''}
    `;
    nav.appendChild(item);
  });
  const sb = document.getElementById('sidebar');
  if(!sb.querySelector('.sidebar-nav')){
    sb.innerHTML=`
      <div class="sidebar-header">
        <h1>MATH TUTORING by Deni</h1>
        <div class="topic">
          <b>Place Value & Large Numbers</b>
          (Konteks: Bisnis)
        </div>

function renderExerciseHTML(secId,idx,item,exNum,key,answered){
  const userAns=state.answers[key];
  const isCorrect=answered && userAns?.correct;
  const isWrong=answered && !userAns?.correct;
  let h=`<div class="exercise-card${isCorrect?' correct':''}${isWrong?' incorrect':''}" id="ex_${key}" data-key="${key}" data-sec="${secId}" data-idx="${idx}">`;
  h+=`<div class="ex-card-header">
    <div class="ex-num">${exNum}</div>
    <div class="ex-label">Exercise</div>
  </div>`;
  h+=`<div class="ex-question">${item.q}</div>`;
  if(item.qId) h+=`<div class="ex-question-id">${item.qId}</div>`;

  // shuffle options for MC
  let shuffledOpts=null, shuffledMap=null;
  if(item.qType==='mc'){
    const origOpts=item.opts.map((o,i)=>({text:o,origIdx:i}));
    // use seeded shuffle based on key for consistency
    const seed=[...key].reduce((a,c)=>a+c.charCodeAt(0),0);
    const seeded=[...origOpts];
    for(let i=seeded.length-1;i>0;i--){
      const j=(seed+i*7)%((i+1));
      [seeded[i],seeded[j]]=[seeded[j],seeded[i]];
    }
    shuffledOpts=seeded.map(o=>o.text);
    shuffledMap=seeded.map(o=>o.origIdx);
  }

  // store shuffle map
  if(shuffledMap) h+=`<div class="shuffle-map" style="display:none" data-map="${shuffledMap.join(',')}"></div>`;

  if(item.qType==='mc'){
    h+=`<div class="ex-options">`;
    const letters='ABCD';
    shuffledOpts.forEach((opt,oi)=>{
      const isSelected=answered && userAns?.selected===oi;
      const isCorrectOpt=shuffledMap[oi]===item.ans;
      let cls='ex-opt';
      if(isSelected && isCorrectOpt) cls+=' correct-answer selected';
      else if(isSelected && !isCorrectOpt) cls+=' wrong-answer selected';
      else if(answered && isCorrectOpt) cls+=' correct-answer';
      h+=`<div class="${cls}" data-oi="${oi}">
        <span class="opt-letter">${letters[oi]}</span>
        <span class="opt-text">${opt}</span>
      </div>`;
    });
    h+=`</div>`;
  } else if(item.qType==='fill'){
    let cls='ex-fill';
    if(answered && isCorrect) cls+=' correct';
    if(answered && isWrong) cls+=' wrong';
    h+=`<div class="ex-fill-wrap">
      <input type="text" class="${cls}" placeholder="Type your answer..." value="${answered?(userAns?.typed||''):''}" ${answered?'disabled':''}/>
    </div>`;
  } else if(item.qType==='tf'){
    h+=`<div class="ex-tf-wrap">`;
    [true,false].forEach(v=>{
      const label=v?'True':'False';
      const isSelected=answered && userAns?.selected===v;
      const isCorrectOpt=item.ans===v;
      let cls='ex-tf-btn';
      if(isSelected && isCorrectOpt) cls+=' correct-answer selected';
      else if(isSelected && !isCorrectOpt) cls+=' wrong-answer selected';
      else if(answered && isCorrectOpt) cls+=' correct-answer';
      h+=`<button class="${cls}" data-val="${v}" ${answered?'disabled':''}>${label}</button>`;
    });
    h+=`</div>`;
  }

  h+=`<div class="ex-check-wrap">
    <button class="btn-check" ${answered?'disabled':''} onclick="checkExercise('${key}')">Check Answer</button>
    <button class="btn-ex-reset" onclick="resetExercise('${key}')"><i class="fas fa-rotate-left"></i> Reset</button>
    <div class="ex-result${answered?' show':''}${isCorrect?' correct':''}${isWrong?' incorrect':''}">
      ${answered?(isCorrect?'<i class="fas fa-check-circle"></i> Correct':'<i class="fas fa-times-circle"></i> Incorrect'):''}
    </div>
  </div>`;

  if(answered){
    h+=`<div class="ex-explanation open"><div class="ex-explanation-inner">
      <strong><i class="fas fa-lightbulb"></i> Explanation:</strong> ${item.exp}
      ${item.expId?'<div class="exp-id">'+item.expId+'</div>':''}
    </div></div>`;
  } else {
    h+=`<div class="ex-explanation"><div class="ex-explanation-inner">
      <strong><i class="fas fa-lightbulb"></i> Explanation:</strong> ${item.exp}
      ${item.expId?'<div class="exp-id">'+item.expId+'</div>':''}
    </div></div>`;
  }

  h+=`</div>`;
  return h;
}

// ===================== BIND EXERCISE EVENTS =====================
function bindExerciseEvents(mc, sec){
  // MC option clicks
  mc.querySelectorAll('.ex-opt').forEach(opt=>{
    opt.addEventListener('click',function(){
      const card=this.closest('.exercise-card');
      if(card.querySelector('.btn-check:disabled')) return;
      card.querySelectorAll('.ex-opt').forEach(o=>o.classList.remove('selected'));
      this.classList.add('selected');
    });
  });
  // TF button clicks
  mc.querySelectorAll('.ex-tf-btn').forEach(btn=>{
    btn.addEventListener('click',function(){
      const card=this.closest('.exercise-card');
      if(card.querySelector('.btn-check:disabled')) return;
      card.querySelectorAll('.ex-tf-btn').forEach(b=>b.classList.remove('selected'));
      this.classList.add('selected');
    });
  });
}

// ===================== CHECK EXERCISE =====================
function checkExercise(key){
  const card=document.getElementById('ex_'+key);
  if(!card) return;
  const secId=card.dataset.sec;
  const idx=parseInt(card.dataset.idx);
  const sec=SECTIONS.find(s=>s.id===secId);
  const item=sec.content[idx];
  let userAnswer={};
  let correct=false;

  if(item.qType==='mc'){
    const selected=card.querySelector('.ex-opt.selected');
    if(!selected){ showToast('Please select an answer','error'); return; }
    const oi=parseInt(selected.dataset.oi);
    const mapEl=card.querySelector('.shuffle-map');
    const map=mapEl?mapEl.dataset.map.split(',').map(Number):[];
    const origIdx=map[oi];
    correct=origIdx===item.ans;
    userAnswer={selected:oi,origIdx,correct};
    // highlight
    card.querySelectorAll('.ex-opt').forEach((opt,i)=>{
      if(map[i]===item.ans) opt.classList.add('correct-answer');
      else if(i===oi && !correct) opt.classList.add('wrong-answer');
    });
  } else if(item.qType==='fill'){
    const input=card.querySelector('.ex-fill');
    const typed=input.value.trim();
    if(!typed){ showToast('Please type an answer','error'); return; }
    correct=normalizeAnswer(typed)===normalizeAnswer(item.ans);
    userAnswer={typed,correct};
    input.classList.add(correct?'correct':'wrong');
    input.disabled=true;
    if(!correct){
      input.value=item.ans;
    }
  } else if(item.qType==='tf'){
    const selected=card.querySelector('.ex-tf-btn.selected');
    if(!selected){ showToast('Please select True or False','error'); return; }
    const val=selected.dataset.val==='true';
    correct=val===item.ans;
    userAnswer={selected:val,correct};
    card.querySelectorAll('.ex-tf-btn').forEach(btn=>{
      const bv=btn.dataset.val==='true';
      if(bv===item.ans) btn.classList.add('correct-answer');
      else if(bv===val && !correct) btn.classList.add('wrong-answer');
      btn.disabled=true;
    });
  }

  // store
  state.answers[key]=userAnswer;
  saveState();

  // UI updates
  card.classList.add(correct?'correct':'incorrect');
  if(!correct) card.classList.add('shake');
  setTimeout(()=>card.classList.remove('shake'),300);

  const checkBtn=card.querySelector('.btn-check');
  checkBtn.disabled=true;

  const result=card.querySelector('.ex-result');
  result.className='ex-result show '+(correct?'correct':'incorrect');
  result.innerHTML=correct?'<i class="fas fa-check-circle"></i> Correct':'<i class="fas fa-times-circle"></i> Incorrect';

  const expl=card.querySelector('.ex-explanation');
  expl.classList.add('open');

  renderMath(card);
  renderSidebar();

  if(correct) showToast('Well done!','success');
  else showToast('Not quite — see explanation','error');
}

function resetExercise(key){
  delete state.answers[key];
  saveState();
  const card=document.getElementById('ex_'+key);
  if(!card) return;
  const secId=card.dataset.sec;
  const sec=SECTIONS.find(s=>s.id===secId);
  if(sec) renderLesson(document.getElementById('main-content'),sec);
  showToast('Exercise reset','error');
}

// ===================== NAV BUTTONS =====================
function renderNavButtons(secId){
  const secIdx=SECTIONS.findIndex(s=>s.id===secId);
  const prevSec=secIdx>0?SECTIONS[secIdx-1]:null;
  const nextSec=secIdx<SECTIONS.length-1?SECTIONS[secIdx+1]:null;
  return `<div class="nav-buttons">
    <button class="btn-nav" ${!prevSec?'disabled':''} onclick="navigateTo('${prevSec?prevSec.id:''}')">
      <i class="fas fa-arrow-left"></i> Previous
    </button>
    <button class="btn-nav" onclick="resetSection('${secId}')" style="color:var(--accent);border-color:var(--accent)">
      <i class="fas fa-rotate-left"></i> Reset Section
    </button>
    <button class="btn-nav" ${!nextSec?'disabled':''} onclick="navigateTo('${nextSec?nextSec.id:''}')">
      Next <i class="fas fa-arrow-right"></i>
    </button>
  </div>`;
}

function resetSection(secId){
  const sec=SECTIONS.find(s=>s.id===secId);
  if(!sec) return;
  sec.content.forEach((item,idx)=>{
    const key=secId+'_'+idx;
    delete state.answers[key];
  });
  saveState();
  navigateTo(secId);
  showToast('Section reset','error');
}
